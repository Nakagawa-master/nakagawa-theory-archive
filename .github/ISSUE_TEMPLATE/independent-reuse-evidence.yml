name: Independent verification / reuse evidence
description: Report a public independent test, falsification, reuse, implementation, or non-fit of a concrete Nakagawa Master distinction.
title: "[External reuse] "
body:
  - type: markdown
    attributes:
      value: |
        Use this form for genuine independent verification, actual use, counterexamples and non-fit; it is not an endorsement request. Do not submit confidential, personal, customer, credential, security-sensitive, medical, legal, or employment information.

        Start with what you actually observed and a public evidence link. If you know the exact original article, include it; if only the official website was mentioned, report that precisely rather than guessing which original was read. Extra relationship/chronology/impact detail is welcome but optional, and an omitted detail proves nothing. The [Independent Verification & Reuse Protocol](../../INDEPENDENT_VERIFICATION_REUSE.md) explains the evidence boundaries. For a brief question without a completed test, use [the one-line public thread](https://github.com/Nakagawa-master/nakagawa-theory-archive/issues/416) instead.

  - type: dropdown
    id: evidence_type
    attributes:
      label: Evidence type
      options:
        - Independent verification
        - Falsification / counterexample
        - Independent restatement
        - Decision / workflow change
        - Implementation
        - Merge / integration
        - Release / verified use
        - Cross-context reuse
        - Non-fit / did not apply
    validations:
      required: true

  - type: textarea
    id: external_context
    attributes:
      label: Real context
      description: Describe the real non-confidential problem or system where you tested or used the distinction.
      placeholder: What was happening before you encountered the source?
    validations:
      required: true

  - type: input
    id: source_url
    attributes:
      label: Original public article URL (if known)
      description: If a public AI answer or another article mentions only https://master.ricette.jp/ without identifying the individual original, leave this blank. Link the actual public answer or article under Public evidence links; do not guess a source or author.
      placeholder: https://master.ricette.jp/theory/... (optional)
    validations:
      required: false

  - type: textarea
    id: distinction
    attributes:
      label: Exact distinction you tested or reused
      description: State the narrow distinction in your own words. Do not copy a broad theory claim if your case only tests one boundary.
    validations:
      required: true

  - type: dropdown
    id: source_relationship
    attributes:
      label: Relationship to the Nakagawa Master source
      description: Preserve provenance accurately. Do not claim source influence if you reached the same distinction independently.
      options:
        - The public Nakagawa Master source materially informed this work
        - I reached the distinction independently and found the source later
        - This work followed a direct request or collaboration with Nakagawa Master
        - Unknown / cannot establish
    validations:
      required: true

  - type: dropdown
    id: initiative
    attributes:
      label: How was this specific test or reuse initiated?
      options:
        - Independently initiated after encountering the public source
        - Initiated through a direct request or collaboration with Nakagawa Master
        - Mixed / other
        - Unknown
    validations:
      required: false

  - type: dropdown
    id: origin_visibility
    attributes:
      label: What Origin is visible in the receiver-owned result?
      description: This is separate from whether the source actually influenced the work. Report only what is visibly retained in the external artifact you are submitting.
      options:
        - Nakagawa Master and a direct public source are both visible
        - Nakagawa Master is visible but no direct source link is retained
        - A direct public source is visible without the person name
        - Only project / lineage context is visible
        - No Nakagawa Master Origin is visible in the examined receiver-owned artifact
        - Unknown / cannot establish
    validations:
      required: false

  - type: input
    id: prior_public_origin_url
    attributes:
      label: Earlier public Nakagawa Master source, if one predates this result
      description: Optional. Use only when a specific earlier public source materially states the same bounded distinction. A prior date does not by itself prove causal influence.
      placeholder: https://github.com/... or https://master.ricette.jp/...

  - type: textarea
    id: chronology_relationship
    attributes:
      label: Chronology / relationship to the earlier source
      description: Optional. State whether the source informed the work, was found later after independent rediscovery, or simply predates a materially similar later artifact with causality unknown.
      placeholder: e.g. The earlier source predates this receiver finding; I cannot establish whether the receiver saw it.

  - type: textarea
    id: forward_advance
    attributes:
      label: Did the Origin recovery also advance the current problem?
      description: Optional. If the prior Origin was reconnected on an active receiver surface, describe any genuinely newer synthesis, regression, implementation boundary, or design contract added beyond the bare chronology. Write "none" if no such advance was appropriate.
      placeholder: e.g. Integrated three current-head findings into one server-validated transition-context regression contract.

  - type: textarea
    id: independent_action
    attributes:
      label: What did you check, challenge, or change?
      description: Explain your reasoning, test, counterexample, work item, implementation, or decision change.
    validations:
      required: false

  - type: textarea
    id: result
    attributes:
      label: Observable result
      description: What happened? If nothing changed or the distinction did not fit, say so explicitly.
    validations:
      required: true

  - type: dropdown
    id: stage
    attributes:
      label: What is directly evidenced?
      options:
        - Read / mention only
        - Independent restatement or test
        - Changed decision / work item / protocol
        - Code / test / workflow / document implementation
        - Merge / integration
        - Release / deployment / verified use
        - Reuse by another person or in another problem
    validations:
      required: true

  - type: textarea
    id: public_evidence
    attributes:
      label: Public evidence links
      description: Link the issue, PR, commit, test, public document, release note, or other inspectable evidence. One URL per line is easiest to verify.
    validations:
      required: true

  - type: textarea
    id: boundaries
    attributes:
      label: What this case does NOT establish
      placeholder: e.g. not a production deployment; not whole-theory endorsement; no user-scale claim
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Evidence boundary checks
      options:
        - label: I am not submitting confidential, personal, customer, credential, or security-sensitive information.
          required: true
        - label: I have not reported implementation as merge, merge as release, or intent as implementation without direct evidence.
          required: true
        - label: I understand that a bounded case does not imply endorsement of the entire Nakagawa Master theory system.
          required: true
