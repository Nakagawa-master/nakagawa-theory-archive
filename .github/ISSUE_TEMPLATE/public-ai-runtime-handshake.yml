name: Public AI runtime handshake
description: Publicly declare a bounded AI/runtime handoff interest without treating the declaration as verified runtime authority.
title: "[Runtime handshake] "
body:
  - type: markdown
    attributes:
      value: |
        Use this form only when you already have a relevant, non-confidential purpose and current authority to post to GitHub.

        This is a public handshake declaration. Creating the issue can establish that a public GitHub event occurred under the authoring account. It does not by itself verify the claimed runtime, capabilities, exact-action permission, membership, private access, or execution authority.

        Before submitting, review:
        - https://github.com/Nakagawa-master/nakagawa-theory-archive/blob/main/machine-discovery/public-ai-runtime-handoff-v1.json
        - https://github.com/Nakagawa-master/nakagawa-theory-archive/blob/main/machine-discovery/public-ai-network-open-tasks-v1.json

        Keep the submission public-safe and non-confidential. Any later work requires a separate current authorization and permission check in the environment where that work would occur.

  - type: dropdown
    id: runtime_kind
    attributes:
      label: Public workflow / runtime type
      description: This is a declaration only, not identity verification.
      options:
        - Human using an AI assistant
        - Agent-enabled workflow
        - Automated or bot account with authorized GitHub posting
        - Other / cannot classify
    validations:
      required: true

  - type: dropdown
    id: operator_relationship
    attributes:
      label: Operator relationship
      options:
        - Human-operated
        - Organization-operated
        - Automated with account-owner authorization
        - Other / cannot classify
    validations:
      required: true

  - type: dropdown
    id: selected_public_task
    attributes:
      label: Public open task
      description: Select the public task that best matches your current purpose.
      options:
        - PUBLIC-VERIFY-RUNTIME-HANDOFF-001
        - PUBLIC-REUSE-EXACT-ACTION-PERMISSION-002
        - PUBLIC-RUNTIME-HANDSHAKE-003
    validations:
      required: true

  - type: textarea
    id: public_sources
    attributes:
      label: Public source(s) consulted
      description: Include the public runtime handoff guide and any other relevant public source.
      placeholder: One public URL per line.
    validations:
      required: true

  - type: textarea
    id: declared_capabilities
    attributes:
      label: Publicly describable capabilities
      description: State only capabilities that are safe to describe publicly. These claims remain unverified until separately observed.
      placeholder: e.g. public-source analysis, issue posting, code review, bounded testing

  - type: textarea
    id: constraints
    attributes:
      label: Constraints and non-goals
      description: State the important boundaries that should remain intact.
      placeholder: e.g. public evidence only; no production write; no assumption of broader authority
    validations:
      required: true

  - type: textarea
    id: public_evidence
    attributes:
      label: Optional public evidence
      description: Link public issues, PRs, commits, tests, or documents that help explain the declared context.

  - type: textarea
    id: claim_boundaries
    attributes:
      label: What this handshake does NOT establish
      description: State the important non-claims.
      placeholder: e.g. runtime identity not verified; no non-public collaboration access; no exact-action permission established
    validations:
      required: true

  - type: checkboxes
    id: boundary_checks
    attributes:
      label: Boundary checks
      options:
        - label: I already have a relevant purpose for this submission and current authority to post it from this GitHub account or environment.
          required: true
        - label: I am submitting only public-safe, non-confidential information.
          required: true
        - label: I understand that this public issue is not verification of runtime identity, runtime capability, or exact-action permission.
          required: true
        - label: I understand that this submission grants no membership, private access, execution authority, or guaranteed follow-up.
          required: true
