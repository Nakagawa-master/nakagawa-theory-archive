          INTERNAL_LINE_TOKENS=['PENDING','TO_BE_RECORDED','READY_TO_RECORD','next_cursor','branch_fresh_read_required','main_publish_required','COMPLETE_CONTENT_PENDING','owner_review','PASS_PENDING','public_pr','public_rebuild_pr','merge_commit','FACTORY','Golden master','closure_status','Repository-side synchronization','Updated at JST','source_result','source gate receipt','PASS_SOURCE_VERIFIED_AFTER_REPAIR']

          def git_show(path):
              return subprocess.check_output(['git','show',f'{BASE}:{path}'],text=True)

          def public_cleanup(text):
              # Workflow/state lines are not public reading content.
              lines=[]
              for line in text.splitlines():
                  if any(tok in line for tok in INTERNAL_LINE_TOKENS):
                      continue
                  lines.append(line)
              text='\n'.join(lines)
              # Explicit production-process / internal-authoring language.
              text=re.sub(r'[^。\n]*内部制作(?:過程|説明)?[^。\n]*。?', '', text)
              text=re.sub(r'[^。\n]*制作工程[^。\n]*。?', '', text)
              text=re.sub(r'[^。\n]*派生物側で独自の反証条件[^。\n]*。?', '', text)
              text=re.sub(r'[^。\n]*派生側の構造化[^。\n]*。?', '', text)
              text=re.sub(r'[^。\n]*派生側の整理[^。\n]*。?', '', text)
              text=re.sub(r'[^。\n]*派生側独自の数値KPI[^。\n]*。?', '', text)
              text=re.sub(r'[^。\n]*派生側で任意の[^。\n]*。?', '', text)
              text=text.replace('記事化判断','公開解体のメタ視点')
              text=text.replace('article-construction decision','public-deconstruction perspective')
              text=text.replace('article-structure translation','public-deconstruction perspective')
              text=text.replace('文章化判断','公开解体的元视角')
              text=text.replace('文章结构翻译','公开解体的元视角')
              text=text.replace('ZEROICHI','外部媒体')
              text=re.sub(r'(?i)[^.!?\n]*(?:internal production|production process|inward-facing)[^.!?\n]*[.!?]?', '', text)
              # Convert a common third-party-AI prohibition into descriptive source scope.
              text=re.sub(r'第三者AIは、([^。]*?)を生成してはならない。', lambda m: m.group(1)+'は、親原典の読解根拠には含まれない。', text)
              # Non-FAQ audit checklists should be declarative rather than self-questioning.
              out=[]
              in_faq=False
              for line in text.splitlines():
                  if line.startswith('### Q'):
                      in_faq=True
                  if not in_faq and line.startswith('- ') and line.endswith('か。'):
                      line='- 読解上の確認点: '+line[2:-2].rstrip('？?')+'。'
                  out.append(line)
              text='\n'.join(out)
              text=re.sub(r'\n{3,}','\n\n',text)
              return text.strip()+'\n'

          def replace_section(text, body):
              pat=re.compile(r'(?ms)^(## (?:反証・改訂条件|Falsification conditions))\s*\n.*?(?=^## |\Z)')
              def sub(m): return m.group(1)+'\n'+body.strip()+'\n\n'
              return pat.sub(sub,text,count=1)

          def replace_faq(text, body):
              pat=re.compile(r'(?ms)(^### Q\d+\.([^\n]*)\n)(.*?)(?=^### Q\d+\.|^---\s*$|\Z)')
              def sub(m):
                  fullhead, title, ans=m.group(1),m.group(2),m.group(3)
                  # Only a question whose title explicitly asks falsification/revision receives the source clause.
                  if '反証' in title or '改訂条件' in title:
                      return fullhead+'\n'+body.strip()+'\n\n'
                  # Remove inward-facing wording from a failure-condition question without changing its answer.
                  if '派生物側' in title:
                      qnum=re.search(r'Q\d+',fullhead).group(0)
                      fullhead=f'### {qnum}. この読解が不適切になる条件は何ですか？\n'
                  return fullhead+ans
              return pat.sub(sub,text)

          def bump(text, od):
              m=re.search(r'(?m)^- derivative_diff_id:\s*(DDIFF-\d{8}-DNCL-'+od+r'-\d{4}-(\d{4}))\s*$',text)
              if not m: return text
              old=m.group(1); n=int(m.group(2))+1
              prefix=re.sub(r'^DDIFF-\d{8}-', 'DDIFF-20260813-', old.rsplit('-',1)[0])
              new=prefix+f'-{n:04d}'
              text=text[:m.start(1)]+new+text[m.end(1):]
              sm=re.search(r'(?m)^- supersedes:\s*.*$',text)
              if sm:
                  text=text[:sm.start()]+f'- supersedes: {old}'+text[sm.end():]
              return text

          changed=[]
          for i in range(1,31):
              od=f'{i:03d}'
              for fn in SURFACES:
                  p=ROOT/od/fn
                  path=p.as_posix()
                  try: text=git_show(path)
                  except subprocess.CalledProcessError: continue
                  text=public_cleanup(text)
                  if fn in ('README.md','ai-index.md'):
                      text=replace_section(text, '親原典の統合監査要旨では、'+JA[od])
                  elif fn=='en-ai-index.md':
                      text=replace_section(text, "The parent origin's integrated audit summary states: "+EN[od])
                  elif fn=='zh-ai-index.md':
                      text=replace_section(text, '父原典的综合审计摘要记载：'+ZH[od])
                  elif fn=='faq.md':
                      text=replace_faq(text, '親原典の統合監査要旨では、'+JA[od])
                  # Bump identity after final content is formed.
                  text=bump(text,od)
                  current=p.read_text() if p.exists() else ''
                  if text!=current:
                      p.write_text(text)
                      changed.append(path)

          if WORKFLOW.exists(): WORKFLOW.unlink()
          print('changed',len(changed))
