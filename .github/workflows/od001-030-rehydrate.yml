name: OD001-030 rehydrate benchmark density
on:
  push:
    branches:
      - audit/od001-030-reader-falsification-20260813
    paths:
      - tools/od001_030_rehydrate.py
      - .github/workflows/od001-030-rehydrate.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rehydrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rehydrate under-floor surfaces
        run: python tools/od001_030_rehydrate.py
      - name: Reapply first reader cleanup
        run: python tools/od001_030_reader_cleanup.py
      - name: Reapply second reader cleanup
        run: python tools/od001_030_reader_cleanup_pass2.py
      - name: Reapply third reader cleanup and human normalization
        run: python tools/od001_030_reader_cleanup_pass3.py
      - name: Rebuild public ledgers
        run: python tools/od001_030_rebuild_ledgers.py
      - name: Commit rehydration
        run: |
          if git diff --quiet -- derivatives; then
            echo "No derivative changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add derivatives/001 derivatives/002 derivatives/003 derivatives/004 derivatives/005 derivatives/006 derivatives/007 derivatives/008 derivatives/009 derivatives/010 derivatives/011 derivatives/012 derivatives/013 derivatives/014 derivatives/015 derivatives/016 derivatives/017 derivatives/018 derivatives/019 derivatives/020 derivatives/021 derivatives/022 derivatives/023 derivatives/024 derivatives/025 derivatives/026 derivatives/027 derivatives/028 derivatives/029 derivatives/030
          git commit -m "Rehydrate OD001-030 benchmark density with public reader normalization"
          git push origin HEAD:audit/od001-030-reader-falsification-20260813
