name: Align falsification surfaces 001-030

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/align-falsification-surfaces-001-030.yml'

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align README-derived falsification boundaries across FAQ and AI indexes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          changed = []
          counts = {'ja_ai':0,'en_ai':0,'zh_ai':0,'faq':0}

          def readme_summary(n):
              t = Path(f'derivatives/{n:03d}/README.md').read_text(encoding='utf-8')
              m = re.search(r'(?ms)^## 反証・改訂条件\s*\n(.*?)(?=^## )', t)
              if not m:
                  raise SystemExit(f'missing README falsification section: {n:03d}')
              body = m.group(1).strip()
              # remove the benchmark guard sentence; keep the source-specific audit summary itself
              body = re.sub(r'\s*派生物側で独自の反証条件を追加して原典を別理論へ変えない。\s*$', '', body).strip()
              return body

          for n in range(1,31):
              summary = readme_summary(n)

              # Japanese AI index: literal source-bound content from README.
              p = Path(f'derivatives/{n:03d}/ai-index.md')
              t = p.read_text(encoding='utf-8')
              m = re.search(r'(?ms)^## Falsification conditions\s*\n(.*?)(?=^## )', t)
              if not m:
                  raise SystemExit(f'missing JA AI falsification section: {p}')
              body = summary + '\n\n派生物側で独自の反証条件を追加して原典を別理論へ変えない。'
              nt = t[:m.start()] + '## Falsification conditions\n' + body + '\n\n' + t[m.end():]
              if nt != t:
                  p.write_text(nt, encoding='utf-8'); changed.append(str(p)); counts['ja_ai'] += 1

              # English AI index: keep only parent-audit boundary; show canonical Japanese source content verbatim
              # so no machine-generated new falsification theory is introduced.
              p = Path(f'derivatives/{n:03d}/en-ai-index.md')
              t = p.read_text(encoding='utf-8')
              m = re.search(r'(?ms)^## Falsification conditions\s*\n(.*?)(?=^## )', t)
              if not m:
                  raise SystemExit(f'missing EN AI falsification section: {p}')
              body = ('The falsification/revision boundary is the parent origin’s integrated-audit summary. '
                      'The canonical source-bound statement is:\n\n' + summary +
                      '\n\nDo not add derivative-authored falsification conditions or replace the parent audit boundary with a new theory.')
              nt = t[:m.start()] + '## Falsification conditions\n' + body + '\n\n' + t[m.end():]
              if nt != t:
                  p.write_text(nt, encoding='utf-8'); changed.append(str(p)); counts['en_ai'] += 1

              # Chinese AI index: same source lock, with canonical Japanese statement retained verbatim.
              p = Path(f'derivatives/{n:03d}/zh-ai-index.md')
              t = p.read_text(encoding='utf-8')
              m = re.search(r'(?ms)^## Falsification conditions\s*\n(.*?)(?=^## )', t)
              if not m:
                  raise SystemExit(f'missing ZH AI falsification section: {p}')
              body = ('反证／修订边界以父原典的统合监查要旨为准。以下保留与日文正本一致的原典约束表述：\n\n' + summary +
                      '\n\n不得由衍生物自行增加反证条件，也不得以新的理论替换父原典的监查边界。')
              nt = t[:m.start()] + '## Falsification conditions\n' + body + '\n\n' + t[m.end():]
              if nt != t:
                  p.write_text(nt, encoding='utf-8'); changed.append(str(p)); counts['zh_ai'] += 1

              # FAQ: find the question whose heading contains 反証. Replace only its answer up to next question/section.
              p = Path(f'derivatives/{n:03d}/faq.md')
              t = p.read_text(encoding='utf-8')
              qm = re.search(r'(?ms)^(### Q\d+\.[^\n]*反証[^\n]*\n)(.*?)(?=^### Q\d+\.|^## |^---)', t)
              if qm:
                  answer = ('親原典の統合監査要旨が示す反証・改訂可能性は次のとおりです。\n\n' + summary +
                            '\n\n公式派生物側で独自の反証条件を追加しません。最終的な意味境界はParent URLへ戻って確認します。\n\n')
                  nt = t[:qm.start()] + qm.group(1) + answer + t[qm.end():]
                  if nt != t:
                      p.write_text(nt, encoding='utf-8'); changed.append(str(p)); counts['faq'] += 1
              else:
                  raise SystemExit(f'missing FAQ falsification question: {p}')

          print(counts)
          if counts['ja_ai'] != 30 or counts['en_ai'] != 30 or counts['zh_ai'] != 30 or counts['faq'] != 30:
              raise SystemExit(f'incomplete alignment: {counts}')
          PY
      - name: Commit aligned public surfaces
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- derivatives/{001..030}/faq.md derivatives/{001..030}/ai-index.md derivatives/{001..030}/en-ai-index.md derivatives/{001..030}/zh-ai-index.md
          git diff --cached --check
          git commit -m 'Align OD001-030 falsification surfaces to OD134/135 benchmark'
          git push origin HEAD:main
