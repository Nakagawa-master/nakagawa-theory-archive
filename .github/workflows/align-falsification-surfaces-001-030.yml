name: Align falsification surfaces 001-030

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/align-falsification-surfaces-001-030.yml'

permissions:
  contents: read

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print canonical falsification summaries
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for n in range(1,31):
              t = Path(f'derivatives/{n:03d}/README.md').read_text(encoding='utf-8')
              m = re.search(r'(?ms)^## 反証・改訂条件\s*\n(.*?)(?=^## )', t)
              if not m:
                  raise SystemExit(f'missing: {n:03d}')
              body = m.group(1).strip()
              body = re.sub(r'\s*派生物側で独自の反証条件を追加して原典を別理論へ変えない。\s*$', '', body).strip()
              print(f'<<<OD{n:03d}>>>')
              print(body)
              print(f'<<<END{n:03d}>>>')
          PY
