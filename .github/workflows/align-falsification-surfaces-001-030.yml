name: Align falsification surfaces 001-030

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/align-falsification-surfaces-001-030.yml'

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Polish translated falsification wording
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              'exploratory投入 itself': 'exploratory input itself',
              '销售、市场、广报、产品与经营判断': '销售、市场、公关、产品与经营判断',
          }
          changed=[]
          for n in range(1,31):
              for fn in ('en-ai-index.md','zh-ai-index.md'):
                  p=Path(f'derivatives/{n:03d}/{fn}')
                  t=p.read_text(encoding='utf-8')
                  nt=t
                  for a,b in replacements.items(): nt=nt.replace(a,b)
                  if nt!=t:
                      p.write_text(nt,encoding='utf-8'); changed.append(str(p))
          print(changed)
          if not changed:
              raise SystemExit('expected translation polish changes')
          PY
      - name: Commit polish
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- derivatives/{001..030}/en-ai-index.md derivatives/{001..030}/zh-ai-index.md
          git diff --cached --check
          git commit -m 'Polish OD001-030 falsification translations'
          git push origin HEAD:main
