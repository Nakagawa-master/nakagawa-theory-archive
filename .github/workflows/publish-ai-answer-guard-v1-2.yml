name: Verify / owner-approved publish AI Answer Guard v1.2.1

on:
  pull_request:
    paths:
      - '.github/workflows/publish-ai-answer-guard-v1-2.yml'
      - 'machine-discovery/build-original-router-mcpb.py'
      - 'machine-discovery/nakagawa-theory-mcp.py'
      - 'machine-discovery/nakagawa-whole-structure-mcp.py'
      - 'machine-discovery/test_unified_existing_mcp.py'
      - 'machine-discovery/test_nakagawa_whole_structure_mcp.py'
      - 'machine-discovery/evidence-integrity-mcp.py'
      - 'machine-discovery/evidence-root-check.py'
      - 'machine-discovery/install-ai-answer-guard.py'
      - 'machine-discovery/test_install_ai_answer_guard.py'
      - 'AI_ANSWER_GUARD_INSTALL.md'
      - 'human-translation/ALL_313_THEORIES_BY_TITLE_AND_THEME.md'
      - 'derivatives/**/README.md'
      - 'derivatives/**/ai-index.md'
      - 'derivatives/**/en-ai-index.md'
      - 'derivatives/**/zh-ai-index.md'
      - 'machine-discovery/quick-route-index-v1.json'
      - 'machine-discovery/problem-to-theory-origin-index-v1.json'
      - 'skills/nakagawa-originals/references/structural_bridges.json'
      - 'metadata/person-name-policy-v1.json'
  workflow_dispatch:
    # Explicit owner-only manual action; never publish on push or PR.

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Real everyday integrity, 313 corpus, modern+legacy and install preview
        run: |
          python3 machine-discovery/nakagawa-theory-mcp.py --self-test
          python3 machine-discovery/test_nakagawa_theory_mcp.py
          python3 machine-discovery/test_unified_existing_mcp.py
          python3 machine-discovery/test_install_ai_answer_guard.py
          python3 machine-discovery/test_nakagawa_whole_structure_mcp.py
          python3 machine-discovery/install-ai-answer-guard.py --host qwen
          python3 machine-discovery/install-ai-answer-guard.py --host codex
      - name: Build and execute unpacked GitHub Release MCP Bundle
        run: |
          python3 machine-discovery/build-original-router-mcpb.py
          test -s dist/ai-answer-guard-1.2.1.mcpb
          python3 machine-discovery/build-original-router-mcpb.py --output dist/independent-copy.mcpb
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          def digest(p):
              return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          assert digest("dist/ai-answer-guard-1.2.1.mcpb") == digest("dist/independent-copy.mcpb")
          print("PASS: deterministic MCPB source package checksum")
          PY

  publish:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && github.repository == 'Nakagawa-master/nakagawa-theory-archive' && github.ref == 'refs/heads/main' && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Build checked exact source MCPB
        run: python3 machine-discovery/build-original-router-mcpb.py
      - name: Publish no-cost immutable GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s dist/ai-answer-guard-1.2.1.mcpb
          if gh release view mcp-guard-v1.2.1 > /dev/null 2>&1; then
            mkdir -p /tmp/mcp-existing
            gh release download mcp-guard-v1.2.1 --pattern "ai-answer-guard-1.2.1.mcpb" --dir /tmp/mcp-existing
            python3 - <<'PY'
          from pathlib import Path
          import hashlib
          created = Path("dist/ai-answer-guard-1.2.1.mcpb").read_bytes()
          published = Path("/tmp/mcp-existing/ai-answer-guard-1.2.1.mcpb").read_bytes()
          assert hashlib.sha256(created).digest() == hashlib.sha256(published).digest(), "Existing released bundle differs: use a NEW release/version, never silently overwrite"
          print("PASS: existing immutable release matches tested source bundle")
          PY
          else
            gh release create mcp-guard-v1.2.1 dist/ai-answer-guard-1.2.1.mcpb \
              --target "$GITHUB_SHA" \
              --title "AI Answer Guard — Practical AI Evidence and Action Preflight v1.2.1" \
              --notes "AI Answer Guard v1.2.1: prevent misleading AI completion claims with caller-provided failed/pending tool receipts, copied evidence roots, permission gaps and irreversible-action review. Nine local read-only tools, preflight FIRST; no API keys, network access or host interception. Real standalone --guard-demo and --guard-input user checks, plus all 313 published derivative-to-canonical-Parent links as optional deeper reading. Developed from original source work by Nakagawa Master (Keisuke Nakagawa), https://master.ricette.jp/ . Requires intentional host invocation; no claim of unseen real-world use. See AI_ANSWER_GUARD_INSTALL.md."
          fi
      - name: Create verified registry metadata for released exact checksum
        run: |
          SHA256="$(sha256sum dist/ai-answer-guard-1.2.1.mcpb | awk '{print $1}')"
          python3 - "$SHA256" <<'PY'
          import json
          import sys
          from pathlib import Path
          digest = sys.argv[1]
          assert len(digest) == 64
          record = {
            "$schema": "https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json",
            "name": "io.github.Nakagawa-master/ai-answer-guard",
            "title": "AI Answer Guard — Source Integrity & Action Preflight",
            "description": "Check AI replies and actions: flag failed tools, copied evidence and missing permission before use.",
            "version": "1.2.1",
            "repository": {
              "url": "https://github.com/Nakagawa-master/nakagawa-theory-archive",
              "source": "github",
              "subfolder": "machine-discovery"
            },
            "packages": [{
              "registryType": "mcpb",
              "identifier": "https://github.com/Nakagawa-master/nakagawa-theory-archive/releases/download/mcp-guard-v1.2.1/ai-answer-guard-1.2.1.mcpb",
              "fileSha256": digest,
              "transport": {"type": "stdio"}
            }]
          }
          Path("dist/server.json").write_text(json.dumps(record, indent=2) + "\n")
          print("Registry bundle SHA256:", digest)
          PY
      - name: Get official upstream MCP publisher
        run: |
          curl -fLsS --retry 3 \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher
          chmod +x ./mcp-publisher
      - name: Validate, authenticate with GitHub OIDC, and submit to official MCP registry
        run: |
          ./mcp-publisher validate dist/server.json
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish dist/server.json
