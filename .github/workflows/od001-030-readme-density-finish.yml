name: OD001-030 README density finish
on:
  push:
    branches:
      - audit/od001-030-reader-falsification-20260813
    paths:
      - tools/od001_030_readme_density_finish.py
      - .github/workflows/od001-030-readme-density-finish.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finish README semantic density
        run: python tools/od001_030_readme_density_finish.py
      - name: Normalize residual wording and footer
        run: |
          python tools/od001_030_reader_cleanup_pass4.py
          python tools/od001_030_footer_and_residual_cleanup.py
      - name: Commit README density completion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add derivatives/001 derivatives/002 derivatives/003 derivatives/004 derivatives/005 derivatives/006 derivatives/007 derivatives/008 derivatives/009 derivatives/010 derivatives/011 derivatives/012 derivatives/013 derivatives/014 derivatives/015 derivatives/016 derivatives/017 derivatives/018 derivatives/019 derivatives/020 derivatives/021 derivatives/022 derivatives/023 derivatives/024 derivatives/025 derivatives/026 derivatives/027 derivatives/028 derivatives/029 derivatives/030
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Complete OD001-030 README benchmark density" && git push origin HEAD:audit/od001-030-reader-falsification-20260813; fi
      - name: Validate all 210 public surfaces
        run: python tools/od001_030_final_validate.py
