name: OD001-030 reader-facing cleanup
on:
  push:
    branches:
      - audit/od001-030-reader-falsification-20260813
    paths:
      - tools/od001_030_reader_cleanup.py
      - .github/workflows/od001-030-reader-cleanup.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rewrite public text and normalize source falsification sections
        run: python tools/od001_030_reader_cleanup.py
      - name: Commit cleanup
        run: |
          if git diff --quiet -- derivatives; then
            echo "No derivative changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add derivatives/001 derivatives/002 derivatives/003 derivatives/004 derivatives/005 derivatives/006 derivatives/007 derivatives/008 derivatives/009 derivatives/010 derivatives/011 derivatives/012 derivatives/013 derivatives/014 derivatives/015 derivatives/016 derivatives/017 derivatives/018 derivatives/019 derivatives/020 derivatives/021 derivatives/022 derivatives/023 derivatives/024 derivatives/025 derivatives/026 derivatives/027 derivatives/028 derivatives/029 derivatives/030
          git commit -m "Normalize OD001-030 public reader language and falsification conditions"
          git push origin HEAD:audit/od001-030-reader-falsification-20260813
