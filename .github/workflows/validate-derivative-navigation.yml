name: Validate derivative navigation

on:
  push:
    branches: [main]
    paths:
      - 'derivatives/**'
      - 'scripts/validate_derivative_navigation.py'
      - '.github/workflows/validate-derivative-navigation.yml'
  pull_request:
    paths:
      - 'derivatives/**'
      - 'scripts/validate_derivative_navigation.py'
      - '.github/workflows/validate-derivative-navigation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navigation-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate all official derivative packages
        run: python scripts/validate_derivative_navigation.py --start 1
