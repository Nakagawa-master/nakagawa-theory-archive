name: OD001-030 public prose residual scan
on:
  push:
    paths:
      - '.github/workflows/od001-030-public-prose-scan.yml'
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan derivative public prose
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('derivatives')
          patterns=[
            r'派生側',r'派生物側',r'公式派生物で',r'本派生物では',r'この派生物では',
            r'内部制作',r'制作工程',r'記事化判断',r'監査都合',r'派生側独自',r'派生物側で独自',
            r'新設しない',r'創作しない',r'作成時',r'作成者',
            r'official derivative must',r'this derivative must',r'derivative-authored',r'internal production',
            r'production process',r'article-construction decision',r'article-structure translation',r'inward-facing',
            r'衍生侧',r'本衍生物必须',r'衍生物必须',r'内部制作',r'文章化判断',r'文章结构翻译',
            r'PENDING',r'TO_BE_RECORDED',r'READY_TO_RECORD',r'next_cursor',r'branch_fresh_read_required',
            r'main_publish_required',r'COMPLETE_CONTENT_PENDING',r'owner_review',r'PASS_PENDING',r'public_pr',
            r'public_rebuild_pr',r'merge_commit',r'Golden master',r'closure_status',r'source gate receipt',
            r'PASS_SOURCE_VERIFIED_AFTER_REPAIR'
          ]
          rx=re.compile('|'.join(f'(?:{p})' for p in patterns),re.I)
          hits=[]; questions=[]
          for i in range(1,31):
            d=root/f'{i:03d}'
            for p in sorted(d.glob('*.md')):
              lines=p.read_text().splitlines()
              in_faq=p.name=='faq.md'
              for n,line in enumerate(lines,1):
                if rx.search(line): hits.append((str(p),n,line))
                if not in_faq:
                  s=line.strip()
                  if (s.startswith('- ') and (s.endswith('か') or s.endswith('か。') or s.endswith('？') or s.endswith('?'))):
                    questions.append((str(p),n,line))
          print('=== INTERNAL_OR_AUTHORING_HITS',len(hits),'===')
          for x in hits: print(f'{x[0]}:{x[1]}: {x[2]}')
          print('=== NONFAQ_QUESTION_HITS',len(questions),'===')
          for x in questions: print(f'{x[0]}:{x[1]}: {x[2]}')
          PY
      - name: Remove temporary scanner
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/od001-030-public-prose-scan.yml
          git config user.name "Nakagawa-master"
          git config user.email "karyu.owner@gmail.com"
          git add -- .github/workflows/od001-030-public-prose-scan.yml
          if ! git diff --cached --quiet; then
            git commit -m "Remove temporary OD001-030 prose scanner"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
