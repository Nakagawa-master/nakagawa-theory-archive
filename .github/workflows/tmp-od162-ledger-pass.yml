name: Temporary OD162 ledger final pass
on:
  push:
    branches: [od162-civilization-audit-i-v2]
    paths: [.github/workflows/tmp-od162-ledger-pass.yml]
permissions:
  contents: write
jobs:
  pass:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: od162-civilization-audit-i-v2
      - name: Mark final pass
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('derivatives/162/derivative-ledger.md')
          s=p.read_text(encoding='utf-8')
          assert 'faq_literal_lock_ci: REQUIRED_AND_PENDING_PR_RUN' in s
          assert 'source_fidelity_owner_review: FRESH_READ_PENDING' in s
          s=s.replace('faq_literal_lock_ci: REQUIRED_AND_PENDING_PR_RUN','faq_literal_lock_ci: PASS')
          s=s.replace('source_fidelity_owner_review: FRESH_READ_PENDING','source_fidelity_owner_review: FRESH_READ_PASS')
          s=s.replace('parent_backlink_display_procedure: INPUT_SYNCED_THROUGH_OD162','parent_backlink_display_procedure: INPUT_SYNCED_THROUGH_OD162\npublic_private_map_content_sha: 7346f48655c048e58e1d43046ea9d25d9de31345')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit final pass
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add derivatives/162/derivative-ledger.md
          git commit -m 'Mark OD162 fresh-read and FAQ lock PASS'
          git push origin HEAD:od162-civilization-audit-i-v2
