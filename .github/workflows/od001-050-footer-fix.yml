name: OD001-050 footer normalization

on:
  push:
    branches:
      - od001-050-footer-lock-20260814

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: od001-050-footer-lock-20260814
          fetch-depth: 0
      - name: Rebuild each README from main and replace footer only
        shell: bash
        run: |
          git fetch origin main
          python - <<'PY'
          from pathlib import Path
          import re, subprocess

          expected = '導線: [公式派生物トップ](../README.md) / [人間向け要約](human-entry.md) / [FAQ](faq.md) / [AI索引・日本語](ai-index.md) / [AI索引・英語](en-ai-index.md) / [AI索引・中国語](zh-ai-index.md) / [派生ID台帳](derivative-ledger.md)'
          pattern = re.compile(r'^導線: .*$', re.MULTILINE)
          for n in range(1, 51):
              p = f'derivatives/{n:03d}/README.md'
              base = subprocess.check_output(['git','show',f'origin/main:{p}'], text=True)
              matches = pattern.findall(base)
              if len(matches) != 1:
                  raise SystemExit(f'{p}: main must contain exactly one footer line, found {len(matches)}')
              new = pattern.sub(expected, base)
              Path(p).write_text(new, encoding='utf-8')
          PY
      - name: Verify exact OD134/135 footer and footer-only diff
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          expected = '導線: [公式派生物トップ](../README.md) / [人間向け要約](human-entry.md) / [FAQ](faq.md) / [AI索引・日本語](ai-index.md) / [AI索引・英語](en-ai-index.md) / [AI索引・中国語](zh-ai-index.md) / [派生ID台帳](derivative-ledger.md)'
          for n in range(1, 51):
              p = f'derivatives/{n:03d}/README.md'
              cur = Path(p).read_text(encoding='utf-8')
              base = subprocess.check_output(['git','show',f'origin/main:{p}'], text=True)
              if cur.splitlines()[-1] != expected:
                  raise SystemExit(f'{p}: footer mismatch')
              cur_lines = cur.splitlines()
              base_lines = base.splitlines()
              if cur_lines[:-1] != base_lines[:-1]:
                  raise SystemExit(f'{p}: non-footer content differs from main')
          changed = subprocess.check_output(['git','diff','--name-only','origin/main','--','derivatives'], text=True).splitlines()
          expected_paths = [f'derivatives/{n:03d}/README.md' for n in range(1,51)]
          if changed != expected_paths:
              raise SystemExit(f'unexpected changed paths: {changed}')
          PY
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/od001-050-footer-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add derivatives/{001..050}/README.md .github/workflows/od001-050-footer-fix.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Normalize OD001-050 README footer to OD134/135 benchmark'
          git push origin HEAD:od001-050-footer-lock-20260814
