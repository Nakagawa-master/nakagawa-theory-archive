name: Public original-source MCP smoke
on:
  pull_request:
    paths:
      - 'machine-discovery/nakagawa-theory-mcp.py'
      - 'machine-discovery/test_nakagawa_theory_mcp.py'
      - 'machine-discovery/agent-team-signal-truth-probe.py'
      - 'machine-discovery/agent-action-boundary-probe.py'
      - 'machine-discovery/test_structural_bridges_ui.py'
      - 'machine-discovery/originals-browser-finder.html'
      - 'machine-discovery/quick-route-index-v1.json'
      - 'machine-discovery/problem-to-theory-origin-index-v1.json'
      - 'skills/nakagawa-originals/**'
      - 'metadata/**'
      - 'machine-discovery/scholarly-metadata-v1.jsonld'
      - 'machine-discovery/ai-repository-routing-map-v1.json'
      - 'scripts/check_public_person_name_fidelity.py'
      - 'scripts/validate_public_identity.py'
      - 'AGENTS.md'
      - 'GEMINI.md'
      - 'CLAUDE.md'
      - 'README.md'
      - 'AI_START_HERE.md'
      - 'llms*.txt'
      - '.github/workflows/public-original-mcp-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'machine-discovery/nakagawa-theory-mcp.py'
      - 'machine-discovery/test_nakagawa_theory_mcp.py'
      - 'machine-discovery/agent-team-signal-truth-probe.py'
      - 'machine-discovery/agent-action-boundary-probe.py'
      - 'machine-discovery/test_structural_bridges_ui.py'
      - 'machine-discovery/originals-browser-finder.html'
      - 'machine-discovery/quick-route-index-v1.json'
      - 'machine-discovery/problem-to-theory-origin-index-v1.json'
      - 'skills/nakagawa-originals/**'
      - 'metadata/**'
      - 'machine-discovery/scholarly-metadata-v1.jsonld'
      - 'machine-discovery/ai-repository-routing-map-v1.json'
      - 'scripts/check_public_person_name_fidelity.py'
      - 'scripts/validate_public_identity.py'
      - 'AGENTS.md'
      - 'GEMINI.md'
      - 'CLAUDE.md'
      - 'README.md'
      - 'AI_START_HERE.md'
      - 'llms*.txt'
      - '.github/workflows/public-original-mcp-smoke.yml'
permissions:
  contents: read
jobs:
  offline-source-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Python self-test across canonical indexes
        run: python3 machine-discovery/nakagawa-theory-mcp.py --self-test
      - name: Independent client subprocess JSON-RPC integration
        run: python3 machine-discovery/test_nakagawa_theory_mcp.py
      - name: Real browser DOM conditional structural exploration in JA EN ZH
        run: python3 machine-discovery/test_structural_bridges_ui.py
      - name: Detect falsely cancelled approvals in independently supplied epoch traces
        run: python3 machine-discovery/agent-team-signal-truth-probe.py --self-test
      - name: Check current-vs-self-claimed authority, 12 model and 9 independent-input controls
        run: python3 machine-discovery/agent-action-boundary-probe.py --self-test
      - name: Portable standalone Agent Skill search and nonfit
        run: python3 skills/nakagawa-originals/scripts/find_original.py --self-test
      - name: Verify public author name and unpublished kanji null across all AI entries
        run: python3 scripts/check_public_person_name_fidelity.py
      - name: Existing Person/schema identity regressions
        run: |
          python3 scripts/validate_public_identity.py --self-test
          python3 scripts/validate_public_identity.py
