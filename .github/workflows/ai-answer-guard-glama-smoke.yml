name: Verify AI Answer Guard container for third-party MCP directories
on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'glama.json'
      - 'server.json'
      - 'machine-discovery/nakagawa-theory-mcp.py'
      - 'machine-discovery/test_ai_answer_guard_container.py'
      - '.github/workflows/ai-answer-guard-glama-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'glama.json'
      - 'server.json'
      - 'machine-discovery/nakagawa-theory-mcp.py'
      - 'machine-discovery/test_ai_answer_guard_container.py'
permissions:
  contents: read
jobs:
  container-introspection:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify directory owner and current MCP source/manifest identity (not a published-release claim)
        run: |
          python3 - <<'PY'
          import ast
          import json
          import re
          from pathlib import Path

          directory = json.loads(Path("glama.json").read_text(encoding="utf-8"))
          manifest = json.loads(Path("server.json").read_text(encoding="utf-8"))
          source = Path("machine-discovery/nakagawa-theory-mcp.py").read_text(encoding="utf-8")
          matches = re.findall(r'^SERVER_INFO\s*=\s*(\{[^\n]+\})', source, flags=re.MULTILINE)
          assert len(matches) == 1, "Expected one source SERVER_INFO assignment"
          info = ast.literal_eval(matches[0])
          assert directory["$schema"] == "https://glama.ai/mcp/schemas/server.json"
          assert directory["maintainers"] == ["Nakagawa-master"]
          assert manifest["name"] == "io.github.Nakagawa-master/ai-answer-guard"
          assert info == {"name": "ai-answer-guard", "version": manifest["version"]}, (info, manifest["version"])
          PY
      - name: Build same 313-source single MCP for Glama-style introspection
        run: docker build --tag nakagawa-ai-answer-guard:glama-smoke .
      - name: Run isolated real MCP legacy/modern and core daily benefit checks
        run: python3 machine-discovery/test_ai_answer_guard_container.py
