name: OD001-030 public source-alignment audit

on:
  push:
    paths:
      - '.github/workflows/od001-030-public-source-audit.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align public derivative wording to parent audit summaries
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import html, json, re, time, urllib.request

          ROOT = Path('derivatives')
          SURFACES = ['README.md','human-entry.md','faq.md','ai-index.md','en-ai-index.md','zh-ai-index.md','derivative-ledger.md']
          WORKFLOW = Path('.github/workflows/od001-030-public-source-audit.yml')

          INTERNAL_LINE_TOKENS = [
              'PENDING','TO_BE_RECORDED','READY_TO_RECORD','next_cursor','branch_fresh_read_required',
              'main_publish_required','COMPLETE_CONTENT_PENDING','owner_review','PASS_PENDING','public_pr',
              'public_rebuild_pr','merge_commit','FACTORY','Golden master','closure_status',
              'Repository-side synchronization','Updated at JST','source_result','source gate receipt',
              'PASS_SOURCE_VERIFIED_AFTER_REPAIR'
          ]
          INTERNAL_PHRASES = [
              '内部制作過程','内部制作説明','制作工程','記事化判断','ZEROICHI',
              'internal production','production process','article-construction decision','article-structure translation','inward-facing',
              '文章化判断','文章结构翻译'
          ]

          class TextExtractor(HTMLParser):
              BLOCK = {'p','li','h1','h2','h3','h4','h5','h6','br','div','section','blockquote','tr','td','th'}
              def __init__(self):
                  super().__init__(); self.parts=[]
              def handle_starttag(self, tag, attrs):
                  if tag in self.BLOCK: self.parts.append('\n')
              def handle_endtag(self, tag):
                  if tag in self.BLOCK: self.parts.append('\n')
              def handle_data(self, data): self.parts.append(data)
              def text(self): return html.unescape(''.join(self.parts))

          def fetch_parent_audit(post_id, parent_url):
              urls = [
                  f'https://master.ricette.jp/wp-json/wp/v2/posts/{post_id}?_fields=content,title,link',
                  parent_url,
              ]
              last = None
              for url in urls:
                  for attempt in range(3):
                      try:
                          req=urllib.request.Request(url, headers={'User-Agent':'OD-public-source-audit/1.0'})
                          with urllib.request.urlopen(req, timeout=30) as r:
                              raw=r.read().decode('utf-8','replace')
                          if '/wp-json/' in url:
                              rendered=json.loads(raw)['content']['rendered']
                          else:
                              rendered=raw
                          p=TextExtractor(); p.feed(rendered); txt=p.text()
                          txt=re.sub(r'\r','',txt)
                          m=re.search(r'統合監査要旨\s*(.*?)\s*局所監査要旨', txt, re.S)
                          if not m:
                              raise RuntimeError('integrated audit summary not found')
                          summary=re.sub(r'[ \t]+',' ',m.group(1))
                          summary=re.sub(r'\n+','\n',summary).strip()
                          c=re.search(r'反証条件(?:としては)?\s*[：:、]?\s*(.*?)(?:\n?署名\s*[：:]|署名：|署名:|$)', summary, re.S)
                          clause=(c.group(1) if c else summary).strip(' \n-*・')
                          clause=re.sub(r'\s+',' ',clause).strip()
                          if len(clause) < 20:
                              raise RuntimeError('falsification clause too short')
                          return clause, summary
                      except Exception as e:
                          last=e; time.sleep(1.5*(attempt+1))
              raise RuntimeError(f'failed source audit fetch post={post_id}: {last}')

          def source_block(lang, clause):
              clause=clause.rstrip('。.!')
              if lang=='ja':
                  return (
                      '親原典の統合監査要旨に記載された反証・改訂条件は次の内容である。'
                      + clause + '。\n\n'
                      'この条件は親原典の公開監査要旨に属し、第三者の人間・AIはParent URLで因果・関係・再合意の記述と一体で確認できる。'
                  )
              if lang=='en':
                  return (
                      "The parent origin's integrated audit summary defines the falsification/revision condition in the source clause below. "
                      "It is presented here as public source information for third-party readers and AIs, with its exact scope anchored to the Parent URL.\n\n"
                      f'Parent audit clause (Japanese original): {clause}。'
                  )
              return (
                  '父原典的综合审计摘要已经给出反证／修订条件。下列内容作为公开的原典依据提供给第三方读者与第三方AI，其准确适用范围以 Parent URL 中的综合审计摘要为准。\n\n'
                  f'父原典审计条款（日文原文）：{clause}。'
              )

          def replace_falsification_section(text, body, heading_lang='ja'):
              pat=re.compile(r'(?ms)^## (?:反証・改訂条件|反証条件|Falsification conditions)\s*\n.*?(?=^## |\Z)')
              heading='## 反証・改訂条件' if heading_lang=='ja' else '## Falsification conditions'
              repl=heading+'\n'+body.strip()+'\n\n'
              if pat.search(text):
                  return pat.sub(repl, text, count=1)
              anchor=re.search(r'(?m)^## (?:必須の区別|Required distinctions)\s*$', text)
              if anchor:
                  return text[:anchor.start()]+repl+text[anchor.start():]
              return text

          def replace_faq_blocks(text, body):
              pat=re.compile(r'(?ms)(^### Q\d+\.[^\n]*\n)(.*?)(?=^### Q\d+\.|^---\s*$|\Z)')
              def sub(m):
                  head, ans=m.group(1),m.group(2)
                  target = ('反証' in head or '改訂' in head or '反証条件' in ans or '改訂対象' in ans or '再検討' in ans)
                  if not target: return m.group(0)
                  return head+'\n'+body.strip()+'\n\n'
              return pat.sub(sub,text)

          def remove_internal_sentences(text):
              # Explicitly internal workflow/state lines are not public derivative prose.
              lines=[]
              for line in text.splitlines():
                  if any(tok in line for tok in INTERNAL_LINE_TOKENS):
                      continue
                  lines.append(line)
              text='\n'.join(lines)
              # Sentences that explicitly describe internal production are removed, not rephrased as internal policy.
              text=re.sub(r'[^。\n]*内部制作[^。\n]*。?', '', text)
              text=re.sub(r'[^。\n]*制作工程[^。\n]*。?', '', text)
              text=re.sub(r'[^。\n]*派生物側で[^。\n]*。?', '', text)
              text=re.sub(r'[^。\n]*派生側で独自[^。\n]*。?', '', text)
              # Structural-reading drift terms are converted to the public-deconstruction perspective.
              text=text.replace('記事化判断','公開解体のメタ視点')
              text=text.replace('article-construction decision','public-deconstruction perspective')
              text=text.replace('article-structure translation','public-deconstruction perspective')
              text=text.replace('文章化判断','公开解体的元视角')
              text=text.replace('文章结构翻译','公开解体的元视角')
              text=text.replace('ZEROICHI','外部媒体')
              text=re.sub(r'(?i)[^.!?\n]*(?:internal production|production process|inward-facing)[^.!?\n]*[.!?]?', '', text)
              text=re.sub(r'\n{3,}','\n\n',text)
              return text.strip()+'\n'

          def convert_nonfaq_check_questions(text):
              out=[]
              for line in text.splitlines():
                  if line.startswith('- ') and line.endswith('か。'):
                      stem=line[2:-2].rstrip('？?')
                      line='- 読解上の確認点: '+stem+'。'
                  out.append(line)
              return '\n'.join(out)+'\n'

          def bump_diff_id(text):
              m=re.search(r'(?m)^- derivative_diff_id: (DDIFF-[^\n]+)$', text)
              if not m: return text, None, None
              old=m.group(1).strip()
              vm=re.match(r'(DDIFF-)(\d{8})(-DNCL-[^-\n]+(?:-[^-\n]+)*-)(\d{4})$', old)
              if not vm:
                  vm2=re.match(r'(.+-)(\d{4})$',old)
                  if not vm2: return text, old, old
                  new=vm2.group(1)+f'{int(vm2.group(2))+1:04d}'
              else:
                  new=vm.group(1)+'20260813'+vm.group(3)+f'{int(vm.group(4))+1:04d}'
              text=text[:m.start(1)]+new+text[m.end(1):]
              sm=re.search(r'(?m)^- supersedes: .*$', text)
              if sm:
                  text=text[:sm.start()]+'- supersedes: '+old+text[sm.end():]
              else:
                  dm=re.search(r'(?m)^- derivative_diff_id: .*$',text)
                  if dm: text=text[:dm.end()]+'\n- supersedes: '+old+text[dm.end():]
              return text,new,old

          parent={}
          for n in range(1,31):
              d=ROOT/f'{n:03d}'
              r=(d/'README.md').read_text(encoding='utf-8')
              pm=re.search(r'Parent Post ID:\s*(\d+)',r,re.I) or re.search(r'Parent post_id:\s*(\d+)',r,re.I)
              um=re.search(r'Parent URL:\s*(\S+)',r,re.I)
              if not pm or not um: raise RuntimeError(f'missing parent identity {n:03d}')
              post=int(pm.group(1)); url=um.group(1)
              clause,summary=fetch_parent_audit(post,url)
              parent[n]=(post,url,clause,summary)
              print(f'OD{n:03d} parent audit clause: {clause[:180]}')

          changed=[]
          current_ids={}
          for n in range(1,31):
              d=ROOT/f'{n:03d}'; clause=parent[n][2]
              for name in SURFACES:
                  if name=='derivative-ledger.md':
                      continue
                  p=d/name
                  if not p.exists(): raise RuntimeError(f'missing surface {p}')
                  old=p.read_text(encoding='utf-8')
                  new=old
                  if name=='README.md':
                      new=replace_falsification_section(new,source_block('ja',clause),'ja')
                  elif name=='faq.md':
                      new=replace_faq_blocks(new,source_block('ja',clause))
                  elif name=='ai-index.md':
                      new=replace_falsification_section(new,source_block('ja',clause),'en')
                  elif name=='en-ai-index.md':
                      new=replace_falsification_section(new,source_block('en',clause),'en')
                  elif name=='zh-ai-index.md':
                      new=replace_falsification_section(new,source_block('zh',clause),'en')
                  new=remove_internal_sentences(new)
                  if name!='faq.md': new=convert_nonfaq_check_questions(new)
                  if new!=old:
                      new,newid,_=bump_diff_id(new)
                      p.write_text(new,encoding='utf-8')
                      changed.append(str(p))
                      if newid: current_ids[(n,name)]=newid
                  else:
                      m=re.search(r'(?m)^- derivative_diff_id: (DDIFF-[^\n]+)$',new)
                      if m: current_ids[(n,name)]=m.group(1)

          # Public ledgers are synchronized to the actual current derivative IDs after content repairs.
          for n in range(1,31):
              d=ROOT/f'{n:03d}'; p=d/'derivative-ledger.md'
              old=p.read_text(encoding='utf-8'); new=remove_internal_sentences(old)
              # First synchronize the six non-ledger rows to the IDs now present in their files.
              for name in SURFACES[:-1]:
                  fp=d/name
                  txt=fp.read_text(encoding='utf-8')
                  mm=re.search(r'(?m)^- derivative_diff_id: (DDIFF-[^\n]+)$',txt)
                  if not mm: continue
                  did=mm.group(1)
                  rowpat=re.compile(r'(?m)^(\|[^\n]*\|\s*'+re.escape(name)+r'\s*\|[^\n]*\|\s*)(DDIFF-[^|\s]+)(\s*\|.*)$')
                  new=rowpat.sub(lambda m:m.group(1)+did+m.group(3),new)
              if new!=old:
                  new,ledgerid,_=bump_diff_id(new)
                  if ledgerid:
                      rowpat=re.compile(r'(?m)^(\|[^\n]*\|\s*derivative-ledger\.md\s*\|[^\n]*\|\s*)(DDIFF-[^|\s]+)(\s*\|.*)$')
                      new=rowpat.sub(lambda m:m.group(1)+ledgerid+m.group(3),new)
                  p.write_text(new,encoding='utf-8'); changed.append(str(p))

          # Final public-facing validation across all 210 surfaces.
          bad=[]
          for n in range(1,31):
              for name in SURFACES:
                  p=ROOT/f'{n:03d}'/name; t=p.read_text(encoding='utf-8')
                  for phrase in INTERNAL_PHRASES:
                      if phrase.lower() in t.lower(): bad.append((str(p),phrase))
                  for tok in INTERNAL_LINE_TOKENS:
                      if tok in t: bad.append((str(p),tok))
                  if '派生物側で' in t or '派生側で独自' in t: bad.append((str(p),'derivative-side internal directive'))
          if bad:
              raise RuntimeError('public-facing validation failed: '+repr(bad[:30]))

          # Ensure every README and every AI index now exposes source-aligned falsification text.
          for n in range(1,31):
              for name in ['README.md','ai-index.md','en-ai-index.md','zh-ai-index.md']:
                  t=(ROOT/f'{n:03d}'/name).read_text(encoding='utf-8')
                  if '統合監査要旨' not in t and "integrated audit summary" not in t and '综合审计摘要' not in t:
                      raise RuntimeError(f'missing source-aligned audit wording: {n:03d}/{name}')

          print('Changed files:',len(set(changed)))
          for x in sorted(set(changed)): print(x)
          PY

          git config user.name 'Nakagawa-master'
          git config user.email 'karyu.owner@gmail.com'
          git rm -- '.github/workflows/od001-030-public-source-audit.yml'
          git add -- derivatives/001 derivatives/002 derivatives/003 derivatives/004 derivatives/005 derivatives/006 derivatives/007 derivatives/008 derivatives/009 derivatives/010 derivatives/011 derivatives/012 derivatives/013 derivatives/014 derivatives/015 derivatives/016 derivatives/017 derivatives/018 derivatives/019 derivatives/020 derivatives/021 derivatives/022 derivatives/023 derivatives/024 derivatives/025 derivatives/026 derivatives/027 derivatives/028 derivatives/029 derivatives/030
          if git diff --cached --quiet; then
            echo 'No changes produced.'
            exit 1
          fi
          git commit -m 'Align OD001-030 falsification sections to parent audit summaries'
          git push origin HEAD:main
