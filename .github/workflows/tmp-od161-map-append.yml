name: Temporary OD161 map append

on:
  push:
    branches: [od161-dark-equation-v2]
    paths: [.github/workflows/tmp-od161-map-append.yml]

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: od161-dark-equation-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Append OD161 without altering prior entries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('derivatives/official-derivatives-map.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          nums = [e.get('number') for e in data['entries']]
          assert nums == [f'{i:03d}' for i in range(1, 161)], 'existing map is not exactly OD001-OD160'
          entry = {
            'number':'161',
            'ncl_id':'NCL-α-20251121-d11365',
            'origin_slug':'nakagawa-master-dark-equation-of-human-history-ai-observation',
            'title':'人類史の暗黒方程式——AIが共通観測した「成功＝搾取90％」という文明の物理法則と、その書き換え',
            'derivative_dir':'derivatives/161',
            'status':'active'
          }
          assert not any(e.get('number') == '161' for e in data['entries'])
          data['entries'].append(entry)
          data['updated_jst'] = '2026-08-17 01:56:00'
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit map update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add derivatives/official-derivatives-map.json
          git commit -m 'Add OD161 to official derivative map'
          git push origin HEAD:od161-dark-equation-v2
