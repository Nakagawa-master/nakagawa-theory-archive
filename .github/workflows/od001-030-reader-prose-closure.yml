name: OD001-030 reader prose closure
on:
  push:
    paths: ['.github/workflows/od001-030-reader-prose-closure.yml']
permissions:
  contents: write
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Close residual producer voice and validate source-bound surfaces
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          R=Path('derivatives'); WF=Path('.github/workflows/od001-030-reader-prose-closure.yml')
          S=['README.md','human-entry.md','faq.md','ai-index.md','en-ai-index.md','zh-ai-index.md','derivative-ledger.md']
          def polish(t):
            t=t.replace('この公開読解で定量値を保持するときは、値だけを再掲してはならない。少なくとも次の六要素を同期させる。','定量値は、値だけを切り離さず、少なくとも次の六要素と一体で読む。')
            t=t.replace('この公開読解で定量値を保持する場合は、','定量値の読解では、').replace('この公開読解で数値を保持するときは、','数値の読解では、')
            t=re.sub(r'親原典にない([^。\n]+?)をこの公開読解で(?:作らない|追加しない|新設しない|創作しない|設定しない|定義しない)。',r'\1は親原典に定義されていない。',t)
            t=re.sub(r'この公開読解で([^。\n]+?)を(?:作らない|追加しない|新設しない|創作しない|設定しない|定義しない)。',r'\1は親原典に定義されていない。',t)
            t=re.sub(r'([^。\n]+?)をこの公開読解で(?:消去していない|削除していない)。',r'\1が保持されている。',t)
            t=re.sub(r'親原典にない([^。\n]+?)は親原典に定義されていな(?:い|かった)。',r'\1は親原典に定義されていない。',t)
            t=re.sub(r'親原典にない([^。\n]+?)は親原典に定義されていません。',r'\1は親原典に定義されていません。',t)
            t=t.replace('これらは非原典のスコアではない。','これらは親原典に定義されたスコアではない。').replace('これらは非原典の採点体系ではない。','これらは親原典に定義された採点体系ではない。')
            t=re.sub(r'(- (?:観測項目|読解上の確認点): )([^\n。]+?)をこの公開読解で(?:消去していない|削除していない)。',r'\1\2が保持されている。',t)
            t=re.sub(r'(- (?:観測項目|読解上の確認点): )([^\n。]+?)をこの公開読解で追加していない。',r'\1\2に非原典要素が付加されていない。',t)
            t=re.sub(r'(- (?:観測項目|読解上の確認点): )([^\n。]+?)をこの公開読解で改変していない。',r'\1\2が原典の意味境界で保持されている。',t)
            t=re.sub(r'(?:This|A) source-bounded public reading does not (?:invent|create|add|define) ([^.]+)\.',lambda m:'The parent origin does not define '+m.group(1).strip()+'.',t,flags=re.I)
            t=t.replace('These are not source-absent additional scores.','These are not scores defined by the parent origin.').replace('These are not source-absent additional scoring systems.','These are not scoring systems defined by the parent origin.')
            t=re.sub(r'The parent origin does not define parent-origin-absent ','The parent origin does not define ',t,flags=re.I)
            t=re.sub(r'本公开读解不(?:新增|创建|自行生成|设定|定义)([^。]+)。',r'父原典未定义\1。',t)
            t=re.sub(r'父原典中不存在的([^。]+)在本公开读解中不(?:新增|创建|自行生成|设定|定义)。',r'\1并未由父原典定义。',t)
            return re.sub(r'\n{3,}','\n\n',t)
          def bump(t,od):
            m=re.search(r'(?m)^- derivative_diff_id:\s*(DDIFF-\d{8}-DNCL-'+od+r'-\d{4}-(\d{4}))\s*$',t)
            if not m:return t
            old=m.group(1); new=re.sub(r'^DDIFF-\d{8}-','DDIFF-20260813-',old.rsplit('-',1)[0])+f'-{int(m.group(2))+1:04d}'
            t=t[:m.start(1)]+new+t[m.end(1):]
            s=re.search(r'(?m)^- supersedes:\s*.*$',t)
            return t if not s else t[:s.start()]+f'- supersedes: {old}'+t[s.end():]
          changed=[]
          for i in range(1,31):
            od=f'{i:03d}'
            for fn in S[:-1]:
              p=R/od/fn; a=p.read_text(); b=polish(a)
              if b!=a:p.write_text(bump(b,od)); changed.append(str(p))
          ids={}
          for i in range(1,31):
            od=f'{i:03d}'; ids[od]={}
            for fn in S:
              t=(R/od/fn).read_text(); m=re.search(r'(?m)^- derivative_diff_id:\s*(\S+)',t)
              if m:ids[od][fn]=m.group(1)
          for i in range(1,31):
            od=f'{i:03d}'; p=R/od/'derivative-ledger.md'; a=p.read_text(); b=polish(a); ls=b.splitlines()
            for j,line in enumerate(ls):
              if line.startswith('|'):
                for fn,did in ids[od].items():
                  if fn!='derivative-ledger.md' and fn in line: line=re.sub(r'DDIFF-\d{8}-DNCL-'+od+r'-\d{4}-\d{4}',did,line)
                ls[j]=line
            b='\n'.join(ls)+'\n'
            if b!=a:
              b=bump(b,od); m=re.search(r'(?m)^- derivative_diff_id:\s*(\S+)',b)
              if m:
                did=m.group(1); b='\n'.join(re.sub(r'DDIFF-\d{8}-DNCL-'+od+r'-\d{4}-\d{4}',did,x) if x.startswith('|') and 'derivative-ledger.md' in x else x for x in b.splitlines())+'\n'
              p.write_text(b); changed.append(str(p))
          pats=[r'派生側',r'派生物側',r'内部制作(?:過程|説明)?',r'制作工程',r'記事化判断',r'ZEROICHI',r'この公開読解で[^。\n]*(?:作らない|追加しない|新設しない|創作しない|設定しない|定義しない|消去していない|削除していない|保持するとき|保持する場合)',r'source-bounded public reading does not (?:invent|create|add|define|delete|remove)',r'internal production|production process|inward-facing|article-construction decision|article-structure translation',r'本公开读解不(?:新增|创建|自行生成|设定|定义|删除)',r'衍生侧',r'文章化判断',r'文章结构翻译',r'PENDING|TO_BE_RECORDED|READY_TO_RECORD|next_cursor|branch_fresh_read_required|main_publish_required|COMPLETE_CONTENT_PENDING|owner_review|PASS_PENDING|public_pr|public_rebuild_pr|merge_commit|Golden master|closure_status|source gate receipt|PASS_SOURCE_VERIFIED_AFTER_REPAIR']
          rx=re.compile('|'.join('(?:'+x+')' for x in pats),re.I); hits=[]
          for i in range(1,31):
            for p in (R/f'{i:03d}').glob('*.md'):
              for n,l in enumerate(p.read_text().splitlines(),1):
                if rx.search(l):hits.append((str(p),n,l))
          fq=[]
          for i in range(1,31):
            p=R/f'{i:03d}'/'faq.md'; t=p.read_text(); q=[int(x) for x in re.findall(r'(?m)^### Q(\d+)\.',t)]
            if q!=list(range(1,31)):fq.append((str(p),q))
            m=re.search(r'(?ms)^### Q30\..*?\n(.*)$',t)
            if m and re.search(r'(?m)^## ',m.group(1)):fq.append((str(p),'post-Q30'))
          fe=[]; pref={'README.md':'親原典の統合監査要旨では、','ai-index.md':'親原典の統合監査要旨では、','en-ai-index.md':"The parent origin's integrated audit summary states:",'zh-ai-index.md':'父原典的综合审计摘要记载：'}
          for i in range(1,31):
            for fn,pr in pref.items():
              p=R/f'{i:03d}'/fn; m=re.search(r'(?ms)^## (?:反証・改訂条件|Falsification conditions)\s*\n(.*?)(?=^## |\Z)',p.read_text())
              if not m or not m.group(1).strip().startswith(pr) or '\n\n' in (m.group(1).strip() if m else ''):fe.append(str(p))
          print('MODIFIED',len(changed)); print('RESIDUAL',len(hits)); [print(x) for x in hits]; print('FAQ_ERRORS',len(fq)); [print(x) for x in fq]; print('FALSIFICATION_ERRORS',len(fe)); [print(x) for x in fe]
          if hits or fq or fe:raise SystemExit('validation failed')
          WF.unlink(missing_ok=True)
          PY
          git config user.name 'Nakagawa-master'
          git config user.email 'karyu.owner@gmail.com'
          git add -- derivatives/001 derivatives/002 derivatives/003 derivatives/004 derivatives/005 derivatives/006 derivatives/007 derivatives/008 derivatives/009 derivatives/010 derivatives/011 derivatives/012 derivatives/013 derivatives/014 derivatives/015 derivatives/016 derivatives/017 derivatives/018 derivatives/019 derivatives/020 derivatives/021 derivatives/022 derivatives/023 derivatives/024 derivatives/025 derivatives/026 derivatives/027 derivatives/028 derivatives/029 derivatives/030 .github/workflows/od001-030-reader-prose-closure.yml
          if ! git diff --cached --quiet; then git commit -m 'Close OD001-030 source-bound reader prose'; git push origin HEAD:${GITHUB_REF_NAME}; fi
