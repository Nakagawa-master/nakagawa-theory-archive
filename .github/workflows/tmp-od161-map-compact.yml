name: Temporary OD161 compact map

on:
  push:
    branches: [od161-dark-equation-v2]
    paths: [.github/workflows/tmp-od161-map-compact.yml]

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: od161-dark-equation-v2
          fetch-depth: 0
      - name: Restore OD160 map formatting and append only OD161
        run: |
          git show d3321adc352403f2d7337017f5e9def0503f0e0f:derivatives/official-derivatives-map.json > /tmp/base-map.json
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/base-map.json')
          s = p.read_text(encoding='utf-8')
          assert '"number":"160"' in s and '"number":"161"' not in s
          s = s.replace('"updated_jst": "2026-08-17 01:26:00"', '"updated_jst": "2026-08-17 01:56:00"')
          marker = '\n  ]\n}'
          entry = ',\n    {"number":"161","ncl_id":"NCL-α-20251121-d11365","origin_slug":"nakagawa-master-dark-equation-of-human-history-ai-observation","title":"人類史の暗黒方程式——AIが共通観測した「成功＝搾取90％」という文明の物理法則と、その書き換え","derivative_dir":"derivatives/161","status":"active"}'
          assert marker in s
          s = s.replace(marker, entry + marker)
          Path('derivatives/official-derivatives-map.json').write_text(s, encoding='utf-8')
          PY
      - name: Commit compact map
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add derivatives/official-derivatives-map.json
          git commit -m 'Keep OD161 map update compact and non-destructive'
          git push origin HEAD:od161-dark-equation-v2
