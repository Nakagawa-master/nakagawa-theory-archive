name: OD001-030 broad public prose audit
on:
  push:
    branches:
      - audit/od001-030-reader-falsification-20260813
    paths:
      - tools/od001_030_broad_language_audit.py
      - .github/workflows/od001-030-broad-language-audit.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan bare normative, self-dialogue, and internal prose
        run: |
          mkdir -p tmp
          python tools/od001_030_broad_language_audit.py > tmp/od001_030_broad_language_report.txt || true
          cat tmp/od001_030_broad_language_report.txt
      - name: Persist temporary audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/od001_030_broad_language_report.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record temporary OD001-030 broad language audit findings"
          git push origin HEAD:audit/od001-030-reader-falsification-20260813
