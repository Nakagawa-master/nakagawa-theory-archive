name: Official Derivative FAQ Literal Lock

on:
  pull_request:
    paths:
      - 'derivatives/**/faq.md'
      - '.github/workflows/official-derivative-faq-literal-lock.yml'
  push:
    branches: [main]
    paths:
      - 'derivatives/**/faq.md'
      - '.github/workflows/official-derivative-faq-literal-lock.yml'

jobs:
  faq-literal-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate OD158+ FAQ literal contract
        shell: python
        run: |
          from pathlib import Path
          import re, sys

          errors = []
          expected_sections = [
              '## 初心者向け｜Q1〜Q10',
              '## 実務者向け｜Q11〜Q20',
              '## AI・研究者向け｜Q21〜Q30',
          ]

          for path in sorted(Path('derivatives').glob('*/faq.md')):
              try:
                  n = int(path.parent.name)
              except ValueError:
                  continue
              if n < 158:
                  continue
              text = path.read_text(encoding='utf-8')

              for heading in expected_sections:
                  if text.count(heading) != 1:
                      errors.append(f'{path}: must contain exactly once: {heading}')

              positions = [text.find(h) for h in expected_sections]
              if all(p >= 0 for p in positions) and positions != sorted(positions):
                  errors.append(f'{path}: FAQ audience sections are out of order')

              qs = [int(x) for x in re.findall(r'^### Q(\d+)\.', text, flags=re.M)]
              if qs != list(range(1, 31)):
                  errors.append(f'{path}: Q sequence must be exactly Q1..Q30; got {qs}')

              forbidden = ['## 基礎層', '## 実務層', '## 監査・反証層']
              for heading in forbidden:
                  if heading in text:
                      errors.append(f'{path}: prohibited substitute heading: {heading}')

              q30 = re.search(r'^### Q30\..*?(?=\n---\n)', text, flags=re.M | re.S)
              if not q30:
                  errors.append(f'{path}: footer separator must immediately follow Q30 answer')
              else:
                  between = q30.group(0)
                  if re.search(r'^## ', between, flags=re.M):
                      errors.append(f'{path}: no H2 section is allowed after Q30 before footer')

          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print('OD158+ FAQ literal contract: PASS')
