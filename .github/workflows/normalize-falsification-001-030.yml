name: Normalize falsification sections 001-030

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-falsification-001-030.yml'

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Brain Vault source corpus
        shell: bash
        run: |
          git clone --depth 1 https://github.com/Nakagawa-master/brain-vault.git /tmp/brain-vault
          test -f /tmp/brain-vault/reference_corpus/official_archive/source/wordpress_export_latest.xml

      - name: Replace falsification sections from parent integrated-audit summaries
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, html, xml.etree.ElementTree as ET

          XML = Path('/tmp/brain-vault/reference_corpus/official_archive/source/wordpress_export_latest.xml')
          CONTENT_NS = '{http://purl.org/rss/1.0/modules/content/}encoded'
          WP_NS = '{http://wordpress.org/export/1.2/}post_id'

          wanted = {}
          for n in range(1, 31):
              p = Path(f'derivatives/{n:03d}/README.md')
              text = p.read_text(encoding='utf-8')
              m = re.search(r'(?m)^- Parent Post ID:\s*(\d+)\s*$', text)
              if not m:
                  raise SystemExit(f'Parent Post ID missing: {p}')
              wanted[int(m.group(1))] = (n, p)

          source_html = {}
          for event, elem in ET.iterparse(XML, events=('end',)):
              if elem.tag.endswith('item'):
                  pid_el = elem.find(WP_NS)
                  if pid_el is not None and pid_el.text and pid_el.text.isdigit():
                      pid = int(pid_el.text)
                      if pid in wanted:
                          ce = elem.find(CONTENT_NS)
                          source_html[pid] = ce.text or '' if ce is not None else ''
                  elem.clear()

          missing_posts = sorted(set(wanted) - set(source_html))
          if missing_posts:
              raise SystemExit(f'parent posts missing from XML: {missing_posts}')

          def strip_tags(fragment: str) -> str:
              fragment = re.sub(r'(?is)<br\s*/?>', '\n', fragment)
              fragment = re.sub(r'(?is)</p\s*>', '\n\n', fragment)
              fragment = re.sub(r'(?is)<li[^>]*>', '- ', fragment)
              fragment = re.sub(r'(?is)</li\s*>', '\n', fragment)
              fragment = re.sub(r'(?is)<[^>]+>', '', fragment)
              fragment = html.unescape(fragment)
              fragment = fragment.replace('\r', '')
              lines = [re.sub(r'[ \t]+', ' ', x).strip() for x in fragment.split('\n')]
              out = []
              blank = False
              for line in lines:
                  if line:
                      out.append(line)
                      blank = False
                  elif out and not blank:
                      out.append('')
                      blank = True
              return '\n'.join(out).strip()

          def extract_integrated_audit(raw: str, pid: int) -> str:
              # Exact source section headed by 統合監査要旨, up to the next heading.
              pat = re.compile(r'(?is)<h([1-6])[^>]*>.*?統合監査要旨.*?</h\1>(.*?)(?=<h[1-6][^>]*>|\Z)')
              m = pat.search(raw)
              if not m:
                  # Some exports wrap the heading text differently; locate the phrase and nearest heading boundary.
                  idx = raw.find('統合監査要旨')
                  if idx < 0:
                      raise SystemExit(f'統合監査要旨 not found in parent post {pid}')
                  starts = [x.start() for x in re.finditer(r'(?is)<h[1-6][^>]*>', raw[:idx])]
                  if not starts:
                      raise SystemExit(f'heading start not found for parent post {pid}')
                  start = starts[-1]
                  close = re.search(r'(?is)</h[1-6]>', raw[idx:])
                  if not close:
                      raise SystemExit(f'heading close not found for parent post {pid}')
                  body_start = idx + close.end()
                  nxt = re.search(r'(?is)<h[1-6][^>]*>', raw[body_start:])
                  body_end = body_start + nxt.start() if nxt else len(raw)
                  body = raw[body_start:body_end]
              else:
                  body = m.group(2)
              text = strip_tags(body)
              if len(text) < 20:
                  raise SystemExit(f'integrated audit summary too short for parent post {pid}: {text!r}')
              return text

          changed = []
          extracted = {}
          for pid, (n, p) in wanted.items():
              summary = extract_integrated_audit(source_html[pid], pid)
              extracted[n] = summary
              text = p.read_text(encoding='utf-8')
              m = re.search(r'(?ms)^## 反証(?:・改訂)?条件\s*\n(.*?)(?=^## )', text)
              if not m:
                  raise SystemExit(f'falsification section missing: {p}')
              new_body = (
                  '親原典の統合監査要旨は、次の内容を反証・改訂可能性として明示している。\n\n'
                  + summary
                  + '\n\n派生物側で独自の反証条件を追加して原典を別理論へ変えない。'
              )
              new_section = '## 反証・改訂条件\n' + new_body + '\n\n'
              new_text = text[:m.start()] + new_section + text[m.end():]
              if new_text != text:
                  p.write_text(new_text, encoding='utf-8')
                  changed.append(str(p))

          print('Extracted source summaries:')
          for n in sorted(extracted):
              one_line = re.sub(r'\s+', ' ', extracted[n])[:220]
              print(f'{n:03d}: {one_line}')
          print('Changed:', len(changed))
          if len(changed) != 30:
              raise SystemExit(f'expected 30 changed README files, got {len(changed)}')
          PY

      - name: Commit source-locked sections
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- derivatives/001/README.md derivatives/002/README.md derivatives/003/README.md derivatives/004/README.md derivatives/005/README.md derivatives/006/README.md derivatives/007/README.md derivatives/008/README.md derivatives/009/README.md derivatives/010/README.md derivatives/011/README.md derivatives/012/README.md derivatives/013/README.md derivatives/014/README.md derivatives/015/README.md derivatives/016/README.md derivatives/017/README.md derivatives/018/README.md derivatives/019/README.md derivatives/020/README.md derivatives/021/README.md derivatives/022/README.md derivatives/023/README.md derivatives/024/README.md derivatives/025/README.md derivatives/026/README.md derivatives/027/README.md derivatives/028/README.md derivatives/029/README.md derivatives/030/README.md
          git diff --cached --check
          git commit -m 'Source-lock OD001-030 falsification sections to parent audit summaries'
          git push origin HEAD:main
