name: Temporary OD162 ledger close
on:
  push:
    branches: [od162-civilization-audit-i-v2]
    paths: [.github/workflows/tmp-od162-ledger-close.yml]
permissions:
  contents: write
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: od162-civilization-audit-i-v2
      - name: Close ledger prerequisites
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('derivatives/162/derivative-ledger.md')
          s=p.read_text(encoding='utf-8')
          repl={
            'public_indexes: UPDATE_REQUIRED_WITH_OD162':'public_indexes: UPDATED_THROUGH_OD162',
            'public_map: UPDATE_REQUIRED_WITH_OD162':'public_map: UPDATED_THROUGH_OD162',
            'private_map: UPDATE_REQUIRED_WITH_OD162_AND_PUBLIC_PRIVATE_IDENTITY':'private_map: UPDATED_THROUGH_OD162_AND_PUBLIC_PRIVATE_IDENTITY',
            'parent_backlink_display_procedure: REQUIRED':'parent_backlink_display_procedure: INPUT_SYNCED_THROUGH_OD162',
            'faq_literal_lock_ci: REQUIRED':'faq_literal_lock_ci: REQUIRED_AND_PENDING_PR_RUN',
            'source_fidelity_owner_review: PENDING_UNTIL_FRESH_READ':'source_fidelity_owner_review: FRESH_READ_PENDING'
          }
          for a,b in repl.items():
            assert a in s
            s=s.replace(a,b)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit ledger
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add derivatives/162/derivative-ledger.md
          git commit -m 'Close OD162 publication prerequisites'
          git push origin HEAD:od162-civilization-audit-i-v2
