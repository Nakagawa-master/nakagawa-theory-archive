name: rebuild-official-derivatives-map

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-official-derivatives-map.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Rebuild complete OD001-280 map from ledgers
        shell: python
        run: |
          import json, re
          from pathlib import Path
          from urllib.parse import urlparse
          from collections import defaultdict

          root = Path('derivatives')
          entries = []
          audit = []

          def grab(s, patterns):
              for pat in patterns:
                  m = re.search(pat, s, re.I | re.M)
                  if m:
                      return m.group(1).strip().strip('`')
              return ''

          for i in range(1, 281):
              num = f'{i:03d}'
              p = root / num / 'derivative-ledger.md'
              if not p.exists():
                  raise SystemExit(f'MISSING_LEDGER OD{num}: {p}')
              s = p.read_text(encoding='utf-8')
              title = grab(s, [
                  r'^\s*[-*]?\s*(?:Parent\s+title|タイトル|title)\s*:\s*(.+?)\s*$',
                  r'^\s*parent_title\s*:\s*(.+?)\s*$',
              ])
              url = grab(s, [
                  r'^\s*[-*]?\s*(?:Parent\s+URL|parent_url)\s*:\s*(\S+)\s*$',
              ])
              ncl = grab(s, [
                  r'^\s*[-*]?\s*(?:Parent\s+NCL-ID|parent_ncl_id)\s*:\s*(\S+)\s*$',
              ])
              pid = grab(s, [
                  r'^\s*[-*]?\s*(?:Parent\s+Post\s+ID|parent_post_id)\s*:\s*([0-9]+)\s*$',
              ])
              if not title or not url or not ncl or not pid:
                  raise SystemExit(f'UNPARSED OD{num}: title={title!r} url={url!r} ncl={ncl!r} pid={pid!r}')
              slug = urlparse(url).path.rstrip('/').split('/')[-1]
              entries.append({
                  'number': num,
                  'ncl_id': ncl,
                  'origin_slug': slug,
                  'title': title,
                  'derivative_dir': f'derivatives/{num}',
                  'status': 'active',
              })
              audit.append((num, int(pid), ncl, url.rstrip('/') + '/'))

          if len(entries) != 280:
              raise SystemExit(f'ENTRY_COUNT_FAIL {len(entries)}')
          if [e['number'] for e in entries] != [f'{i:03d}' for i in range(1,281)]:
              raise SystemExit('NUMBER_SEQUENCE_FAIL')

          by_pid = defaultdict(list)
          by_ncl = defaultdict(list)
          by_url = defaultdict(list)
          for num,pid,ncl,url in audit:
              by_pid[pid].append(num)
              by_ncl[ncl].append(num)
              by_url[url].append(num)
          dup_pid = {k:v for k,v in by_pid.items() if len(v)>1}
          dup_ncl = {k:v for k,v in by_ncl.items() if len(v)>1}
          dup_url = {k:v for k,v in by_url.items() if len(v)>1}

          payload = {
              'version': '2.1.0-complete-ledger-derived-map',
              'updated_jst': '2026-08-28 11:54:00',
              'entries': entries,
          }
          out = root / 'official-derivatives-map.json'
          out.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          print(f'MAP_ENTRIES={len(entries)}')
          print(f'RANGE={entries[0]["number"]}-{entries[-1]["number"]}')
          print('DUPLICATE_PARENT_POST_IDS=' + json.dumps(dup_pid, ensure_ascii=False, sort_keys=True))
          print('DUPLICATE_PARENT_NCL_IDS=' + json.dumps(dup_ncl, ensure_ascii=False, sort_keys=True))
          print('DUPLICATE_PARENT_URLS=' + json.dumps(dup_url, ensure_ascii=False, sort_keys=True))
          for target in ('057','067','068'):
              row = next(x for x in audit if x[0] == target)
              print('TARGET_' + target + '=' + '\t'.join(map(str,row)))
          print('MAP_REBUILD_PASS')
      - name: Commit rebuilt map
        run: |
          git config user.name "Nakagawa-master"
          git config user.email "karyu.owner@gmail.com"
          git add derivatives/official-derivatives-map.json
          if git diff --cached --quiet; then
            echo "No map changes"
          else
            git commit -m "Rebuild complete OD001-280 origin backlink map"
            git push origin HEAD:main
          fi
