name: OD001-030 third-party prose final alignment
on:
  push:
    paths:
      - '.github/workflows/od001-030-third-party-prose-final.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rewrite residual authoring prose and non-FAQ self-questions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          ROOT=Path('derivatives')
          SURFACES=['README.md','human-entry.md','faq.md','ai-index.md','en-ai-index.md','zh-ai-index.md','derivative-ledger.md']
          WORKFLOW=Path('.github/workflows/od001-030-third-party-prose-final.yml')

          def rewrite_authoring(text):
              # Remove any sentence that explicitly discusses non-public production procedure.
              text=re.sub(r'[^。\n]*(?:内部制作過程|内部制作説明|制作工程)[^。\n]*。?', '', text)
              text=re.sub(r'(?i)[^.!?\n]*(?:internal production|production process|inward-facing)[^.!?\n]*[.!?]?', '', text)

              # Public-reader wording: describe the reading surface rather than instructing an author/producer.
              jp_repls=[
                  ('公式派生物で','この公開読解で'),('本派生物では','この公開読解では'),('この派生物では','この公開読解では'),
                  ('派生物側で','この公開読解で'),('派生側で','この公開読解で'),
                  ('派生物側が','この公開読解が'),('派生側が','この公開読解が'),
                  ('派生物側の','この公開読解の'),('派生側の','この公開読解の'),
                  ('派生物側は','この公開読解は'),('派生側は','この公開読解は'),
                  ('派生物側','この公開読解'),('派生側','この公開読解'),
                  ('監査都合の','親原典にない'),
                  ('記事化判断','公開解体のメタ視点'),
                  ('ZEROICHI','外部媒体'),
              ]
              for a,b in jp_repls: text=text.replace(a,b)

              # Turn explicit authoring prohibitions about invented quantities into source-scope statements.
              forms=[
                  ('を創作してはいけません','は親原典に定義されていません'),
                  ('を創作してはならない','は親原典に定義されていない'),
                  ('を創作しません','は親原典に定義されていません'),
                  ('を創作しない','は親原典に定義されていない'),
                  ('を新設してはいけません','は親原典に定義されていません'),
                  ('を新設してはならない','は親原典に定義されていない'),
                  ('を新設しません','は親原典に定義されていません'),
                  ('を新設しない','は親原典に定義されていない'),
              ]
              for a,b in forms: text=text.replace(a,b)
              text=text.replace('創作しない。','親原典の定義範囲に限定される。')
              text=text.replace('創作しません。','親原典の定義範囲に限定されます。')
              text=text.replace('新設しない。','親原典の定義範囲に限定される。')
              text=text.replace('新設しません。','親原典の定義範囲に限定されます。')
              text=text.replace('作成時','読解時').replace('作成者','記述主体')

              # Clean common public-reading phrases after subject replacement.
              text=text.replace('この公開読解の採点KPI','非原典の採点KPI')
              text=text.replace('この公開読解の数式モデル','非原典の数式モデル')
              text=text.replace('この公開読解の固定数値','非原典の固定数値')
              text=text.replace('この公開読解の数値閾値','非原典の数値閾値')
              text=text.replace('この公開読解の評価尺度','非原典の評価尺度')
              text=text.replace('この公開読解の点数','非原典の点数')
              text=text.replace('この公開読解の危険度','非原典の危険度')
              text=text.replace('この公開読解のスコア','非原典のスコア')
              text=text.replace('この公開読解独自の','非原典の')
              text=text.replace('この公開読解で独自の','親原典にない')

              # English: public descriptive surface rather than author instructions.
              text=text.replace('Accordingly, an official derivative must neither delete these numbers nor promote them beyond what the source supports.',
                                'Accordingly, this source-bounded public reading keeps these numbers together with their source status without promoting them beyond what the parent supports.')
              text=re.sub(r'(?i)this derivative must not\s+', 'This source-bounded public reading does not ', text)
              text=re.sub(r'(?i)an official derivative must not\s+', 'A source-bounded public reading does not ', text)
              text=re.sub(r'(?i)official derivative must not\s+', 'A source-bounded public reading does not ', text)
              text=text.replace('derivative-authored','source-absent additional')
              text=text.replace('derivative-created','source-absent additional')
              text=text.replace('article-construction decision','public-deconstruction perspective')
              text=text.replace('article-structure translation','public-deconstruction perspective')

              # Chinese: descriptive public-reading subject rather than producer-side subject.
              text=text.replace('衍生侧自创的','父原典未定义的')
              text=text.replace('衍生侧自创','父原典未定义')
              text=text.replace('由衍生侧擅自','非原典地')
              text=text.replace('衍生侧','本公开读解')
              text=text.replace('本衍生物必须','本公开读解')
              text=text.replace('衍生物必须','本公开读解')
              text=text.replace('本公开读解不得','本公开读解不')
              text=text.replace('文章化判断','公开解体的元视角')
              text=text.replace('文章结构翻译','公开解体的元视角')

              text=re.sub(r'\n{3,}','\n\n',text)
              return text

          def rewrite_nonfaq_questions(text, lang):
              out=[]
              for line in text.splitlines():
                  s=line.strip()
                  # Parent-title metadata preserves the source title literally, including question wording.
                  if s.startswith(('- タイトル:','- Title:','- 标题:')):
                      out.append(line); continue
                  if not s.startswith('- '):
                      out.append(line); continue
                  if lang=='ja' and (s.endswith('か') or s.endswith('か。') or s.endswith('？')):
                      core=s[2:]
                      core=re.sub(r'(か。|か|？)$','',core)
                      out.append('- 観測項目: '+core+'。')
                  elif lang=='en' and s.endswith('?'):
                      core=s[2:-1].strip()
                      out.append('- Observation focus: whether '+core[0].lower()+core[1:]+'.')
                  elif lang=='zh' and s.endswith('？'):
                      core=s[2:-1].strip()
                      out.append('- 观察重点：'+core+'。')
                  else:
                      out.append(line)
              return '\n'.join(out)+'\n'

          def bump(text, od):
              m=re.search(r'(?m)^- derivative_diff_id:\s*(DDIFF-\d{8}-DNCL-'+od+r'-\d{4}-(\d{4}))\s*$',text)
              if not m: return text
              old=m.group(1); n=int(m.group(2))+1
              prefix=re.sub(r'^DDIFF-\d{8}-','DDIFF-20260813-',old.rsplit('-',1)[0])
              new=prefix+f'-{n:04d}'
              text=text[:m.start(1)]+new+text[m.end(1):]
              sm=re.search(r'(?m)^- supersedes:\s*.*$',text)
              if sm:
                  text=text[:sm.start()]+f'- supersedes: {old}'+text[sm.end():]
              return text

          modified=set()
          # First update all non-ledger surfaces.
          for i in range(1,31):
              od=f'{i:03d}'
              for fn in SURFACES:
                  if fn=='derivative-ledger.md': continue
                  p=ROOT/od/fn
                  if not p.exists(): continue
                  old=p.read_text()
                  new=rewrite_authoring(old)
                  if fn!='faq.md':
                      lang='en' if fn=='en-ai-index.md' else ('zh' if fn=='zh-ai-index.md' else 'ja')
                      new=rewrite_nonfaq_questions(new,lang)
                  if new!=old:
                      new=bump(new,od)
                      p.write_text(new)
                      modified.add(str(p))

          # Collect final IDs after non-ledger modifications.
          ids={}
          for i in range(1,31):
              od=f'{i:03d}'
              ids[od]={}
              for fn in SURFACES:
                  p=ROOT/od/fn
                  if not p.exists(): continue
                  m=re.search(r'(?m)^- derivative_diff_id:\s*(\S+)',p.read_text())
                  if m: ids[od][fn]=m.group(1)

          # Ledgers: rewrite public prose, sync surface IDs, then bump ledger once and sync its own row.
          for i in range(1,31):
              od=f'{i:03d}'; p=ROOT/od/'derivative-ledger.md'
              if not p.exists(): continue
              old=p.read_text(); new=rewrite_authoring(old); new=rewrite_nonfaq_questions(new,'ja')
              for fn,did in ids[od].items():
                  if fn=='derivative-ledger.md': continue
                  # Replace DDIFF in any markdown table row naming the file.
                  lines=[]
                  for line in new.splitlines():
                      if line.startswith('|') and fn in line:
                          line=re.sub(r'DDIFF-\d{8}-DNCL-'+od+r'-\d{4}-\d{4}',did,line)
                      lines.append(line)
                  new='\n'.join(lines)+'\n'
              if new!=old:
                  new=bump(new,od)
                  m=re.search(r'(?m)^- derivative_diff_id:\s*(\S+)',new)
                  ledger_id=m.group(1) if m else None
                  if ledger_id:
                      lines=[]
                      for line in new.splitlines():
                          if line.startswith('|') and 'derivative-ledger.md' in line:
                              line=re.sub(r'DDIFF-\d{8}-DNCL-'+od+r'-\d{4}-\d{4}',ledger_id,line)
                          lines.append(line)
                      new='\n'.join(lines)+'\n'
                  p.write_text(new); modified.add(str(p))

          # Residual validation. FAQ is allowed to remain Q&A; source-title metadata is literal source text.
          patterns=[
            r'派生側',r'派生物側',r'公式派生物で',r'本派生物では',r'この派生物では',
            r'内部制作',r'制作工程',r'記事化判断',r'監査都合',r'派生側独自',r'派生物側で独自',
            r'新設しない',r'創作しない',r'作成時',r'作成者',
            r'official derivative must',r'this derivative must',r'derivative-authored',r'derivative-created',
            r'internal production',r'production process',r'article-construction decision',r'article-structure translation',r'inward-facing',
            r'衍生侧',r'本衍生物必须',r'衍生物必须',r'内部制作',r'文章化判断',r'文章结构翻译',
            r'PENDING',r'TO_BE_RECORDED',r'READY_TO_RECORD',r'next_cursor',r'branch_fresh_read_required',
            r'main_publish_required',r'COMPLETE_CONTENT_PENDING',r'owner_review',r'PASS_PENDING',r'public_pr',
            r'public_rebuild_pr',r'merge_commit',r'Golden master',r'closure_status',r'source gate receipt',r'PASS_SOURCE_VERIFIED_AFTER_REPAIR'
          ]
          rx=re.compile('|'.join(f'(?:{x})' for x in patterns),re.I)
          hits=[]; qhits=[]
          for i in range(1,31):
              d=ROOT/f'{i:03d}'
              for p in d.glob('*.md'):
                  isfaq=p.name=='faq.md'
                  for n,line in enumerate(p.read_text().splitlines(),1):
                      if rx.search(line): hits.append((str(p),n,line))
                      s=line.strip()
                      if not isfaq and s.startswith('- ') and not s.startswith(('- タイトル:','- Title:','- 标题:')) and (s.endswith('?') or s.endswith('？') or s.endswith('か') or s.endswith('か。')):
                          qhits.append((str(p),n,line))
          print('MODIFIED',len(modified))
          print('RESIDUAL_AUTHORING',len(hits))
          for x in hits[:200]: print(x)
          print('RESIDUAL_NONFAQ_QUESTIONS',len(qhits))
          for x in qhits[:200]: print(x)
          if hits or qhits:
              raise SystemExit('residual public-prose scan failed')

          if WORKFLOW.exists(): WORKFLOW.unlink()
          PY
          git config user.name "Nakagawa-master"
          git config user.email "karyu.owner@gmail.com"
          git add -- derivatives/001 derivatives/002 derivatives/003 derivatives/004 derivatives/005 derivatives/006 derivatives/007 derivatives/008 derivatives/009 derivatives/010 derivatives/011 derivatives/012 derivatives/013 derivatives/014 derivatives/015 derivatives/016 derivatives/017 derivatives/018 derivatives/019 derivatives/020 derivatives/021 derivatives/022 derivatives/023 derivatives/024 derivatives/025 derivatives/026 derivatives/027 derivatives/028 derivatives/029 derivatives/030 .github/workflows/od001-030-third-party-prose-final.yml
          if ! git diff --cached --quiet; then
            git commit -m "Remove OD001-030 authoring prose and non-FAQ self-questions"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
