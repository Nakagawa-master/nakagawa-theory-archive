name: OD001-030 final public-language cleanup

on:
  push:
    paths:
      - '.github/workflows/od001-030-public-language-cleanup-runner.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: reaudit/od001-030-public-language-cleanup-20260813
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Execute cleanup with source-question distinction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          wf=Path('.github/workflows/od001-030-public-language-cleanup.yml').read_text(encoding='utf-8')
          marker="python - <<'PY'\n"
          start=wf.index(marker)+len(marker)
          end=wf.index("\n          PY\n",start)
          code=textwrap.dedent(wf[start:end])

          en_insert='''def en(text):\n  text=text.replace('A second audit layer asks whether the seven-axis differences actually connect to upstream distribution. Do they change who defines problems, which options are considered, who controls evaluation criteria, or who leads update speed? Counterexamples must remain visible.', 'A second audit layer evaluates whether the seven-axis differences actually connect to upstream distribution by observing changes in who defines problems, which options are considered, who controls evaluation criteria, and who leads update speed. Counterexamples must remain visible.')\n  text=text.replace('Under the rule that a number must not travel without epistemic status, the seven-axis count is bound to the following meaning:', 'The number 7 refers only to the seven structural observation axes enumerated in the parent.')\n  text=text.replace('The term "nonlinear" is not converted here into an invented mathematical function. The parent-level meaning is that the effects of the axes are structurally interdependent and cannot be safely represented as a simple sum of independent scores. No source-absent additional weights, coefficients, amplification rates, or cutoffs are introduced.', 'In the parent, "nonlinear" describes structural interdependence among the seven axes rather than a specified mathematical function. The parent does not provide additional weights, coefficients, amplification rates, or cutoffs.')\n  pats=['''
          code=code.replace("def en(text):\n  pats=[",en_insert,1)

          zh_insert='''def zh(text):\n  text=text.replace('第二层审计是观察七轴差异是否真的连接到上游配置。它是否改变谁定义问题、哪些选项被考虑、谁控制评价标准、谁主导更新速度？反例不能被排除。', '第二层审计观察七轴差异与上游配置之间的连接，包括问题定义者、候选选项、评价标准控制者与更新速度主导者是否发生变化。反例不能被排除。')\n  text=text.replace('“非线性”在这里不被转换成派生侧自创的数学函数。它只保持为父原典范围内的结构含义：七轴之间存在相互依赖，不能安全地表示成彼此独立分数的简单加总。派生侧不添加权重、系数、增幅率或阈值。', '父原典中的“非线性”指七轴之间的结构性相互依赖，而非一个已指定的数学函数；父原典也未给出额外权重、系数、增幅率或阈值。')\n  pats=['''
          code=code.replace("def zh(text):\n  pats=[",zh_insert,1)

          qfail="if qbad:raise RuntimeError('non-FAQ question scan failed: '+repr(qbad[:100]))"
          qfilter="def _quoted_or_source_question(item):\\n  _,_,line=item\\n  if line.startswith('- Title:'):\\n    return True\\n  probe=re.sub(r'“[^”]*[?？][^”]*”','',line)\\n  probe=re.sub(r'\\\"[^\\\"\\\\n]*[?？][^\\\"\\\\n]*\\\"','',probe)\\n  return ('?' not in probe and '？' not in probe)\\nqbad=[item for item in qbad if not _quoted_or_source_question(item)]\\nif qbad:raise RuntimeError('non-FAQ question scan failed: '+repr(qbad[:100]))"
          if qfail not in code:
            raise RuntimeError('question result validator patch point not found')
          code=code.replace(qfail,qfilter,1)

          exec(compile(code,'od001_030_cleanup','exec'),{})
          PY

      - name: Commit repaired surfaces and remove one-shot workflows
        shell: bash
        run: |
          git config user.name 'Nakagawa-master'
          git config user.email 'karyu.owner@gmail.com'
          git rm -- '.github/workflows/od001-030-public-language-cleanup.yml' '.github/workflows/od001-030-public-language-cleanup-runner.yml'
          git add -- derivatives/001 derivatives/002 derivatives/003 derivatives/004 derivatives/005 derivatives/006 derivatives/007 derivatives/008 derivatives/009 derivatives/010 derivatives/011 derivatives/012 derivatives/013 derivatives/014 derivatives/015 derivatives/016 derivatives/017 derivatives/018 derivatives/019 derivatives/020 derivatives/021 derivatives/022 derivatives/023 derivatives/024 derivatives/025 derivatives/026 derivatives/027 derivatives/028 derivatives/029 derivatives/030
          if git diff --cached --quiet; then echo 'No changes produced.'; exit 1; fi
          git commit -m 'Remove internal authoring language from OD001-030'
          git push origin HEAD:"${TARGET_BRANCH}"
