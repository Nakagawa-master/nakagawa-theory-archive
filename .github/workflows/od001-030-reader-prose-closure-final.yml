name: OD001-030 reader prose closure final
on:
  push:
    paths: ['.github/workflows/od001-030-reader-prose-closure-final.yml']
permissions:
  contents: write
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Apply final source-bound prose corrections and validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          R=Path('derivatives'); S=['README.md','human-entry.md','faq.md','ai-index.md','en-ai-index.md','zh-ai-index.md','derivative-ledger.md']
          WF1=Path('.github/workflows/od001-030-reader-prose-closure.yml'); WF2=Path('.github/workflows/od001-030-reader-prose-closure-final.yml')
          exact={
          '親原典が本構造読解の普遍的KPIとして定義していない医学的有病率、改善率、診断精度、企業損失額、固定閾値、確率をこの公開読解で作らない。数字を扱う場合は、親原典内に存在し、その測定主体・測定対象・出典・用途・非保証範囲が確認できるものに限る。':'医学的有病率、改善率、診断精度、企業損失額、固定閾値、確率は、親原典で本構造読解の普遍的KPIとして定義されていない。数字の読解は、親原典内に存在し、その測定主体・測定対象・出典・用途・非保証範囲が確認できるものに限られる。',
          '`S = U × R × H` とKは親原典由来の構造記号として保持する。原典はU/R/H/Kの一般利用向け固定尺度、固定情報量上限、万能な最適帯域、成功確率、合格値を定義していないため、この公開読解で追加しない。':'`S = U × R × H` とKは親原典由来の構造記号である。U/R/H/Kの一般利用向け固定尺度、固定情報量上限、万能な最適帯域、成功確率、合格値は親原典に定義されていない。',
          '原典にない一般KPI、成功率、危険度、停止頻度の合格閾値をこの公開読解で作らない。θやδも原典由来の構造変数として保持し、対象別の観測設計なしに固定数値化しない。':'一般KPI、成功率、危険度、停止頻度の合格閾値は親原典に定義されていない。θやδは原典由来の構造変数であり、対象別の観測設計と切り離した固定数値ではない。',
          '生成速度、資料数、AI利用率、表現統一度などは、それ自体では成功指標にしない。連結責任が欠けている場合、これらの上昇はズレの再生産速度を高め得るため、反転評価可能性を保持する。原典にない総合スコア、危険確率、固定閾値はこの公開読解で作らない。':'生成速度、資料数、AI利用率、表現統一度などは、それ自体では成功指標にならない。連結責任が欠けている場合、これらの上昇はズレの再生産速度を高め得るため、反転評価可能性がある。総合スコア、危険確率、固定閾値は親原典に定義されていない。',
          '原典にない期待利回り、推奨配分、元本保証確率、安全スコア、商品ランキングをこの公開読解で作らない。監査対象は次である。':'期待利回り、推奨配分、元本保証確率、安全スコア、商品ランキングは親原典に定義されていない。監査対象は次である。',
          '原典にない期待利回り、推奨配分、元本保証確率、安全スコアをこの公開読解で作らない。確認するのは、現在の積立残高と将来修繕費の関係、費用前提の更新頻度、必要時の流動性、許容できる元本毀損範囲、住民への説明可能性、合意手続、制度適合、商品・運用主体の責任線、運用後も修繕目的を損なわないかである。':'期待利回り、推奨配分、元本保証確率、安全スコアは親原典に定義されていない。確認対象は、現在の積立残高と将来修繕費の関係、費用前提の更新頻度、必要時の流動性、許容できる元本毀損範囲、住民への説明可能性、合意手続、制度適合、商品・運用主体の責任線、運用後も修繕目的を損なわないかという点である。',
          '原典にない全国普及率、最適拠点数、固定価格優位率、満足度スコア、成功確率をこの公開読解で作らない。確認対象は次である。':'全国普及率、最適拠点数、固定価格優位率、満足度スコア、成功確率は親原典に定義されていない。確認対象は次である。',
          '原典にない全国普及率、最適店舗数、利用者満足スコア、固定価格優位率などをこの公開読解で作らない。確認するのは、利用可能時間、長時間利用時の料金合理性、利用開始・返却の拘束、立地アクセス、問い合わせ導線、予約・車両供給の成立、従来手段との供給ギャップが実際に縮まるかである。':'全国普及率、最適店舗数、利用者満足スコア、固定価格優位率などは親原典に定義されていない。確認対象は、利用可能時間、長時間利用時の料金合理性、利用開始・返却の拘束、立地アクセス、問い合わせ導線、予約・車両供給の成立、従来手段との供給ギャップの縮小である。',
          '原典にない受注増加率、成約確率、AI効果スコア、固定ROIをこの公開読解で作らない。監査対象は次である。':'受注増加率、成約確率、AI効果スコア、固定ROIは親原典に定義されていない。監査対象は次である。',
          '親原典に明示されていない数値閾値、成功確率、性能順位、全国適用率をこの公開読解で設定しない。第三者は対象構造と公開解体層の二層をParent URLで確認する。':'数値閾値、成功確率、性能順位、全国適用率は親原典に明示されていない。第三者は対象構造と公開解体層の二層をParent URLで確認できる。'
          }
          def polish(t):
            t=t.replace('この公開読解で定量値を保持するときは、値だけを再掲してはならない。少なくとも次の六要素を同期させる。','定量値は、値だけを切り離さず、少なくとも次の六要素と一体で読む。')
            t=t.replace('この公開読解で定量値を保持する場合は、','定量値の読解では、').replace('この公開読解で数値を保持するときは、','数値の読解では、')
            t=re.sub(r'親原典にない([^。\n]+?)をこの公開読解で(?:作らない|追加しない|新設しない|創作しない|設定しない|定義しない)。',r'\1は親原典に定義されていない。',t)
            t=re.sub(r'この公開読解で([^。\n]+?)を(?:作らない|追加しない|新設しない|創作しない|設定しない|定義しない)。',r'\1は親原典に定義されていない。',t)
            t=re.sub(r'([^。\n]+?)をこの公開読解で(?:消去していない|削除していない)。',r'\1が保持されている。',t)
            t=re.sub(r'親原典にない([^。\n]+?)は親原典に定義されていな(?:い|かった)。',r'\1は親原典に定義されていない。',t)
            t=re.sub(r'親原典にない([^。\n]+?)は親原典に定義されていません。',r'\1は親原典に定義されていません。',t)
            t=t.replace('これらは非原典のスコアではない。','これらは親原典に定義されたスコアではない。').replace('これらは非原典の採点体系ではない。','これらは親原典に定義された採点体系ではない。')
            t=re.sub(r'(- (?:観測項目|読解上の確認点): )([^\n。]+?)をこの公開読解で(?:消去していない|削除していない)。',r'\1\2が保持されている。',t)
            t=re.sub(r'(- (?:観測項目|読解上の確認点): )([^\n。]+?)をこの公開読解で追加していない。',r'\1\2に非原典要素が付加されていない。',t)
            t=re.sub(r'(- (?:観測項目|読解上の確認点): )([^\n。]+?)をこの公開読解で改変していない。',r'\1\2が原典の意味境界で保持されている。',t)
            t=re.sub(r'(?:This|A) source-bounded public reading does not (?:invent|create|add|define) ([^.]+)\.',lambda m:'The parent origin does not define '+m.group(1).strip()+'.',t,flags=re.I)
            t=t.replace('These are not source-absent additional scores.','These are not scores defined by the parent origin.').replace('These are not source-absent additional scoring systems.','These are not scoring systems defined by the parent origin.')
            t=re.sub(r'The parent origin does not define parent-origin-absent ','The parent origin does not define ',t,flags=re.I)
            t=re.sub(r'本公开读解不(?:新增|创建|自行生成|设定|定义)([^。]+)。',r'父原典未定义\1。',t)
            t=re.sub(r'父原典中不存在的([^。]+)在本公开读解中不(?:新增|创建|自行生成|设定|定义)。',r'\1并未由父原典定义。',t)
            for a,b in exact.items(): t=t.replace(a,b)
            return re.sub(r'\n{3,}','\n\n',t)
          def bump(t,od):
            m=re.search(r'(?m)^- derivative_diff_id:\s*(DDIFF-\d{8}-DNCL-'+od+r'-\d{4}-(\d{4}))\s*$',t)
            if not m:return t
            old=m.group(1); new=re.sub(r'^DDIFF-\d{8}-','DDIFF-20260813-',old.rsplit('-',1)[0])+f'-{int(m.group(2))+1:04d}'
            t=t[:m.start(1)]+new+t[m.end(1):]; s=re.search(r'(?m)^- supersedes:\s*.*$',t)
            return t if not s else t[:s.start()]+f'- supersedes: {old}'+t[s.end():]
          changed=[]
          for i in range(1,31):
            od=f'{i:03d}'
            for fn in S[:-1]:
              p=R/od/fn; a=p.read_text(); b=polish(a)
              if b!=a:p.write_text(bump(b,od));changed.append(str(p))
          ids={}
          for i in range(1,31):
            od=f'{i:03d}';ids[od]={}
            for fn in S:
              m=re.search(r'(?m)^- derivative_diff_id:\s*(\S+)',(R/od/fn).read_text())
              if m:ids[od][fn]=m.group(1)
          for i in range(1,31):
            od=f'{i:03d}';p=R/od/'derivative-ledger.md';a=p.read_text();b=polish(a);ls=b.splitlines()
            for j,line in enumerate(ls):
              if line.startswith('|'):
                for fn,did in ids[od].items():
                  if fn!='derivative-ledger.md' and fn in line:line=re.sub(r'DDIFF-\d{8}-DNCL-'+od+r'-\d{4}-\d{4}',did,line)
                ls[j]=line
            b='\n'.join(ls)+'\n'
            if b!=a:
              b=bump(b,od);m=re.search(r'(?m)^- derivative_diff_id:\s*(\S+)',b)
              if m:b='\n'.join(re.sub(r'DDIFF-\d{8}-DNCL-'+od+r'-\d{4}-\d{4}',m.group(1),x) if x.startswith('|') and 'derivative-ledger.md' in x else x for x in b.splitlines())+'\n'
              p.write_text(b);changed.append(str(p))
          pats=[r'派生側',r'派生物側',r'内部制作(?:過程|説明)?',r'制作工程',r'記事化判断',r'ZEROICHI',r'この公開読解で[^。\n]*(?:作らない|追加しない|新設しない|創作しない|設定しない|定義しない|消去していない|削除していない|保持するとき|保持する場合)',r'source-bounded public reading does not (?:invent|create|add|define|delete|remove)',r'internal production|production process|inward-facing|article-construction decision|article-structure translation',r'本公开读解不(?:新增|创建|自行生成|设定|定义|删除)',r'衍生侧',r'文章化判断',r'文章结构翻译',r'PENDING|TO_BE_RECORDED|READY_TO_RECORD|next_cursor|branch_fresh_read_required|main_publish_required|COMPLETE_CONTENT_PENDING|owner_review|PASS_PENDING|public_pr|public_rebuild_pr|merge_commit|Golden master|closure_status|source gate receipt|PASS_SOURCE_VERIFIED_AFTER_REPAIR']
          rx=re.compile('|'.join('(?:'+x+')' for x in pats),re.I);hits=[]
          for i in range(1,31):
            for p in (R/f'{i:03d}').glob('*.md'):
              for n,l in enumerate(p.read_text().splitlines(),1):
                if rx.search(l):hits.append((str(p),n,l))
          fq=[]
          for i in range(1,31):
            p=R/f'{i:03d}'/'faq.md';t=p.read_text();q=[int(x) for x in re.findall(r'(?m)^### Q(\d+)\.',t)]
            if q!=list(range(1,31)):fq.append((str(p),q))
            m=re.search(r'(?ms)^### Q30\..*?\n(.*)$',t)
            if m and re.search(r'(?m)^## ',m.group(1)):fq.append((str(p),'post-Q30'))
          fe=[];pref={'README.md':'親原典の統合監査要旨では、','ai-index.md':'親原典の統合監査要旨では、','en-ai-index.md':"The parent origin's integrated audit summary states:",'zh-ai-index.md':'父原典的综合审计摘要记载：'}
          for i in range(1,31):
            for fn,pr in pref.items():
              p=R/f'{i:03d}'/fn;m=re.search(r'(?ms)^## (?:反証・改訂条件|Falsification conditions)\s*\n(.*?)(?=^## |\Z)',p.read_text());body=m.group(1).strip() if m else ''
              if not m or not body.startswith(pr) or '\n\n' in body:fe.append(str(p))
          print('MODIFIED',len(changed));print('RESIDUAL',len(hits));[print(x) for x in hits];print('FAQ_ERRORS',len(fq));[print(x) for x in fq];print('FALSIFICATION_ERRORS',len(fe));[print(x) for x in fe]
          if hits or fq or fe:raise SystemExit('validation failed')
          WF1.unlink(missing_ok=True);WF2.unlink(missing_ok=True)
          PY
          git config user.name 'Nakagawa-master'
          git config user.email 'karyu.owner@gmail.com'
          git add -- derivatives/001 derivatives/002 derivatives/003 derivatives/004 derivatives/005 derivatives/006 derivatives/007 derivatives/008 derivatives/009 derivatives/010 derivatives/011 derivatives/012 derivatives/013 derivatives/014 derivatives/015 derivatives/016 derivatives/017 derivatives/018 derivatives/019 derivatives/020 derivatives/021 derivatives/022 derivatives/023 derivatives/024 derivatives/025 derivatives/026 derivatives/027 derivatives/028 derivatives/029 derivatives/030 .github/workflows/od001-030-reader-prose-closure.yml .github/workflows/od001-030-reader-prose-closure-final.yml
          if ! git diff --cached --quiet; then git commit -m 'Finalize OD001-030 source-bound reader prose'; git push origin HEAD:${GITHUB_REF_NAME}; fi
